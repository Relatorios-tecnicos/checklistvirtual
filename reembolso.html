<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f4; --text:#15181e; --muted:#5d6675; --line:#dde1e8;
  --brand:#c8102e; --brand-ink:#ffffff; --brand-soft:#fdecef;
  --ok:#17803d; --ok-soft:#e6f5ec; --warn:#a15c00; --warn-soft:#fff3dc; --err:#b42318; --err-soft:#fde9e7; --info:#1d4ed8; --info-soft:#e8eefc;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b21; --surface2:#222630; --text:#eceef2; --muted:#9aa3b2; --line:#2c313c;
    --brand:#ef4a63; --brand-ink:#16080b; --brand-soft:#33151b;
    --ok:#4ccf80; --ok-soft:#13281b; --warn:#f2b44d; --warn-soft:#2b2210; --err:#ff8a7d; --err-soft:#33191a; --info:#8fb0ff; --info-soft:#18223a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --surface2:#222630; --text:#eceef2; --muted:#9aa3b2; --line:#2c313c;
  --brand:#ef4a63; --brand-ink:#16080b; --brand-soft:#33151b;
  --ok:#4ccf80; --ok-soft:#13281b; --warn:#f2b44d; --warn-soft:#2b2210; --err:#ff8a7d; --err-soft:#33191a; --info:#8fb0ff; --info-soft:#18223a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1840px;margin:0 auto;padding:0 24px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.demo{font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
select,input[type=text],input[type=number],input[type=date],input[type=month],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
select{width:auto}
textarea{min-height:76px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:0 0 4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card h2{margin:0 0 4px;font-size:17px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
h1.page{font-size:22px;margin:18px 0 2px;letter-spacing:-.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.Rascunho{background:var(--surface2);color:var(--muted)}
.chip.Enviado{background:var(--info-soft);color:var(--info)}
.chip.Ajuste{background:var(--warn-soft);color:var(--warn)}
.chip.Aprovado{background:var(--ok-soft);color:var(--ok)}
.chip.Pago{background:var(--ok);color:#fff}
.chip.TELMEX{background:var(--info-soft);color:var(--info)}
.chip.CFTV{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;letter-spacing:-.3px}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.item .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .tr{color:var(--muted);font-size:13px;margin-top:6px;word-break:break-word}
.item .num{margin-left:auto;font-weight:700}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--info-soft);color:var(--info)}
.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0 10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;min-height:40px}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:700;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;background:var(--surface2)}
.sheet-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:10px}
.sheet-h div{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:13px}
.sheet-h b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:1840px;margin:0 auto;display:flex}
nav.bottom button{flex:1;border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-height:56px}
nav.bottom button.on{color:var(--brand)}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.stops .s{display:flex;gap:8px;margin-bottom:8px}
.stops .s select{flex:1;width:100%}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);max-width:520px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bottom"><div class="in" id="nav"></div></nav>
<div id="toast"></div>

/* ============================================================
   MOTOR DE PREENCHIMENTO: edita só as células de dados do XML
   das planilhas originais, preservando formatação, logos e mesclas
   ============================================================ */
const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const colToN=c=>{let n=0;for(const ch of c)n=n*26+ch.charCodeAt(0)-64;return n};
const splitRef=r=>{const m=/^([A-Z]+)(\d+)$/.exec(r);return[m[1],+m[2]]};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const serial=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000)};

class Sheet{
  constructor(xml){
    this.doc=new DOMParser().parseFromString(xml,'application/xml');
    this.sd=this.doc.getElementsByTagNameNS(NS,'sheetData')[0];
  }
  row(r){
    let before=null;
    for(const el of this.sd.children){
      const n=+el.getAttribute('r');
      if(n===r)return el;
      if(n>r){before=el;break}
    }
    const el=this.doc.createElementNS(NS,'row');el.setAttribute('r',r);
    this.sd.insertBefore(el,before);return el;
  }
  cell(ref){
    const[col,r]=splitRef(ref);const row=this.row(r);const cn=colToN(col);let before=null;
    for(const c of row.children){
      const[cc]=splitRef(c.getAttribute('r'));const n=colToN(cc);
      if(n===cn)return c;
      if(n>cn){before=c;break}
    }
    const c=this.doc.createElementNS(NS,'c');c.setAttribute('r',ref);
    row.insertBefore(c,before);return c;
  }
  style(ref){return this.cell(ref).getAttribute('s')}
  set(ref,v,style){
    const c=this.cell(ref);
    while(c.firstChild)c.removeChild(c.firstChild);
    c.removeAttribute('t');
    if(v!==null&&v!==undefined&&v!==''){
      if(typeof v==='number'){
        const e=this.doc.createElementNS(NS,'v');e.textContent=String(v);c.appendChild(e);
      }else{
        c.setAttribute('t','inlineStr');
        const is=this.doc.createElementNS(NS,'is');const t=this.doc.createElementNS(NS,'t');
        t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
        t.textContent=String(v);is.appendChild(t);c.appendChild(is);
      }
    }
    if(style!==undefined&&style!==null)c.setAttribute('s',style);
  }
  height(r,ht){const el=this.row(r);el.setAttribute('ht',String(ht));el.setAttribute('customHeight','1')}
  xml(){return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+new XMLSerializer().serializeToString(this.doc).replace(/^<\?xml[^>]*\?>\s*/,'')}
}
class Styles{
  constructor(xml){
    this.doc=new DOMParser().parseFromString(xml,'application/xml');
    this.xfs=this.doc.getElementsByTagNameNS(NS,'cellXfs')[0];this.cache={};
  }
  wrap(idx){
    idx=+idx||0;
    if(this.cache[idx]!==undefined)return this.cache[idx];
    const n=this.xfs.children[idx].cloneNode(true);
    n.setAttribute('applyAlignment','1');
    let al=[...n.children].find(e=>e.localName==='alignment');
    if(!al){al=this.doc.createElementNS(NS,'alignment');n.insertBefore(al,n.firstChild)}
    al.setAttribute('wrapText','1');al.setAttribute('vertical','center');
    this.xfs.appendChild(n);
    this.xfs.setAttribute('count',String(this.xfs.children.length));
    return this.cache[idx]=this.xfs.children.length-1;
  }
  date(idx){
    idx=+idx||0;this.dc=this.dc||{};
    if(this.dc[idx]!==undefined)return this.dc[idx];
    const root=this.doc.documentElement;
    let nfs=this.doc.getElementsByTagNameNS(NS,'numFmts')[0];
    if(!nfs){nfs=this.doc.createElementNS(NS,'numFmts');root.insertBefore(nfs,root.firstChild)}
    let id=null,max=163;
    for(const n of nfs.children){const i=+n.getAttribute('numFmtId');if(i>max)max=i;if(n.getAttribute('formatCode')==='dd/mm/yyyy')id=i}
    if(id===null){id=max+1;const n=this.doc.createElementNS(NS,'numFmt');n.setAttribute('numFmtId',String(id));n.setAttribute('formatCode','dd/mm/yyyy');nfs.appendChild(n);nfs.setAttribute('count',String(nfs.children.length))}
    const x=this.xfs.children[idx].cloneNode(true);x.setAttribute('numFmtId',String(id));x.setAttribute('applyNumberFormat','1');
    this.xfs.appendChild(x);this.xfs.setAttribute('count',String(this.xfs.children.length));
    return this.dc[idx]=this.xfs.children.length-1;
  }
  xml(){return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+new XMLSerializer().serializeToString(this.doc).replace(/^<\?xml[^>]*\?>\s*/,'')}
}
async function openTpl(key){
  await lib('jszip');
  const zip=await JSZip.loadAsync(TPL[key],{base64:true});
  const sheet=new Sheet(await zip.file('xl/worksheets/sheet1.xml').async('string'));
  return{zip,sheet};
}
async function saveTpl(zip,sheet,styles){
  zip.file('xl/worksheets/sheet1.xml',sheet.xml());
  if(styles)zip.file('xl/styles.xml',styles.xml());
  return zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
}

const PROJ={TELMEX:{label:'TELMEX',curto:'TELMEX',nome:'PROJETO TELMEX'},'CFTV BRADESCO':{label:'CFTV BRADESCO',curto:'CFTV',nome:'PROJETO CFTV BRADESCO'}};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
/* Solicitação: a última linha de cada bloco é só um espaçador; cabem 2 linhas Telmex (31-32) e 8 CFTV (40-47) */
const LIM={kmLinhas:25,solicKm:2,solicTelmex:2,solicCftv:8};
/* tipos de despesa: campo do lançamento -> [rótulo na tela, rótulo sem acento (PDF/nome de arquivo), rótulo na Solicitação] */
const TIPOS={pedagio:['Pedágio','PEDAGIO','PEDAGIO'],estac:['Estacionamento','ESTACIONAMENTO','ESTAC.'],hosp:['Hospedagem','HOSPEDAGEM','HOSPEDAGEM'],alim:['Alimentação','ALIMENTACAO','ALIMENTACAO'],material:['Material','MATERIAL','MATERIAL'],outros:['Outros','OUTROS','OUTROS']};
/* Despesas extras ativas no site. Por enquanto só alimentação; hospedagem, material e outros ficam prontos no código
   (basta incluir aqui) até o financeiro definir como entram na Solicitação. */
const EXTRAS=['alim'];
const campoTipo=t=>TIPOS[t]&&t!=='tag'?t:'pedagio';
const optsTipo=sel=>['pedagio','estac',...EXTRAS].map(t=>`<option value="${t}" ${t===sel?'selected':''}>${TIPOS[t][0]}</option>`).join('');

function semCoord(t){return String(t||'').replace(/\s*[-–—(]?\s*-?\d{1,2}\.\d{3,}\s*[,;]\s*-?\d{1,3}\.\d{3,}\s*\)?/g,'').replace(/[\s,;-]+$/,'').trim()}
function trajeto(home,stops){
  const seq=[home,...stops,home];const L={};let n=0;const out=[];
  for(const a of seq){if(!(a in L))L[a]=String.fromCharCode(65+n++);out.push(L[a]+': '+semCoord(a))}
  return out.join(' / ');
}
const projsDe=e=>[...new Set(((e.metas&&e.metas.length)?e.metas.map(m=>m.proj):[e.projeto]).filter(Boolean))];
const kmProj=e=>e.split?e.split:{[e.projeto]:+e.km||0};
const projLabel=e=>{const p=projsDe(e);return p.length>1?p.join(' / '):e.projeto};
const motivoKm=e=>{const p=projsDe(e);
  if(p.length>1)return e.metas.map(m=>`${m.ch||''} PROJETO ${PROJ[m.proj].curto}`.trim()).join(' / ');
  return`${(e.chamado||'').trim()} PROJETO ${PROJ[e.projeto].curto}`.trim()};
function ultimoDia(month){const[y,m]=month.split('-').map(Number);const d=new Date(Date.UTC(y,m,0));return d.toISOString().slice(0,10)}
const fmtBR=iso=>iso?iso.split('-').reverse().join('/'):'';
const brl=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function calc(user,month){
  const es=user.entries.filter(e=>e.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  const home=user.profile.home;
  const rows=es.map(e=>({...e,trajeto:trajeto(home,e.stops||[])}));
  const kmP={TELMEX:0,'CFTV BRADESCO':0};
  rows.forEach(e=>{const m=kmProj(e);for(const p in m)kmP[p]=(kmP[p]||0)+(+m[p]||0)});
  const valP={};Object.keys(kmP).forEach(p=>valP[p]=r2(kmP[p]*FATOR));
  const exp={TELMEX:[],'CFTV BRADESCO':[]};
  rows.forEach(e=>{
    if(+e.pedagio>0)exp[e.projeto].push({tipo:'PEDAGIO',date:e.date,valor:+e.pedagio,nota:String(e.notaPed||'').trim()});
    if(+e.estac>0)exp[e.projeto].push({tipo:'ESTAC.',date:e.date,valor:+e.estac,nota:String(e.notaEst||'').trim()});
    /* hospedagem, material e outros: linhas comuns no bloco do projeto (sem placa no nº da nota) */
    for(const k of['hosp','material','outros'].filter(k=>EXTRAS.includes(k)))if(+e[k]>0)exp[e.projeto].push({tipo:TIPOS[k][2]+(k==='outros'&&String(e.outrosDesc||'').trim()?' - '+String(e.outrosDesc).trim().toUpperCase():''),date:e.date,valor:+e[k],nota:'',semPlaca:true});
  });

}

function problemas(user,month){

}

const RE_TAG=/^(\d{2})\/(\d{2})\/(\d{4}) - (\d{2}:\d{2}) (\S+) (Passagem|Estacionamento|Ped[áa]gio) (.*?) - ([\d.]+,\d{2}) ([\d.]+,\d{2})$/;

  const out=[];
  for(let p=1;p<=pdf.numPages;p++){

    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);

  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.translate(c.width/2,c.height/2);x.rotate(o.rot*Math.PI/180);x.drawImage(im,sx,sy,sw,sh,-rw/2,-rh/2,rw,rh);
  return c.toDataURL('image/jpeg',o.q);
}
async function imgPequena(src,rot){ /* cabe no limite de 400 mil caracteres do Firestore */
  let d='';for(const[m,q]of[[1300,.62],[1100,.55],[950,.5],[800,.45],[650,.4]]){d=await imgPronta(src,{max:m,q,rot,crop:true});if(d.length<=380000)return d}
  return d}
function notaOcr(dd){const t=String(dd.text||'');const pal=(t.match(/[A-Za-zÀ-ú]{4,}/g)||[]).length;return(dd.confidence||0)+2*pal}
function comprimir(file,max,q){return new Promise((ok,err)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>err(new Error('Não consegui abrir a imagem'));im.src=url})}
function valoresDe(texto){
  const c=new Map();
  const linhas=String(texto||'').split('\n');
  linhas.forEach((l,i)=>{
    const forte=/(valor|total|pago|pagar|tarifa|r\$)/i.test(l)&&!/(imposto|iss|pis|cofins|ibs|cbs|tribut|lei|aprox)/i.test(l);
    /* a linha de cima ou de baixo de "VALOR" também conta (recibos em colunas) */
    const vizinha=!forte&&[linhas[i-1],linhas[i+1]].some(x=>x&&/\bvalor\b/i.test(x)&&!/(imposto|aprox)/i.test(x));
    const re=/(\d{1,3}(?:\.\d{3})*|\d+)\s*[,.]\s*(\d{2})(?!\d)(\s*%)?/g;let m;
    while((m=re.exec(l))){
      if(m[3])continue;
      const v=+(m[1].replace(/\./g,'')+'.'+m[2]);
      if(v>0&&v<1000){const k=v.toFixed(2);const o=c.get(k)||{v,p:0};o.p+=forte?4:vizinha?3:1;c.set(k,o)}
    }
  });
  return[...c.values()].sort((a,b)=>b.p-a.p||b.v-a.v).slice(0,5).map(x=>x.v);
}

let RECIBOS=[];
function dataDoRecibo(txt,mes){
  const ok=[];const re=/\b(\d{2})[\/.\-](\d{2})[\/.\-](\d{4}|\d{2})\b/g;let m;
  while((m=re.exec(String(txt||'')))){const y=m[3].length===2?'20'+m[3]:m[3];if(+m[1]>=1&&+m[1]<=31&&+m[2]>=1&&+m[2]<=12)ok.push(`${y}-${m[2]}-${m[1]}`)}
  return ok.find(x=>x.startsWith(mes))||ok[0]||'';
}
async function lerRecibo(r){
  let w=null;
  try{
    r.rot=0;
    try{
      await carregaTess();w=await Tesseract.createWorker('por');
      const sonda=async rot=>{const im=await imgPronta(r.file,{max:900,q:.7,rot,crop:true});const dd=(await w.recognize(im)).data;return{rot,nota:notaOcr(dd),conf:dd.confidence||0}};
      let melhor=await sonda(0);
      if(melhor.nota<110){for(const g of[90,270]){const t=await sonda(g);if(t.nota>melhor.nota)melhor=t}
        if(melhor.nota<110){const t=await sonda(180);if(t.nota>melhor.nota)melhor=t}}
      r.rot=melhor.rot;
    }catch(e){r.erro=e.message}
    r.img=await imgPequena(r.file,r.rot);
    if(w){try{const grande=await imgPronta(r.file,{max:1800,q:.85,rot:r.rot,crop:true});const t=(await w.recognize(grande)).data.text;
      r.cands=valoresDe(t);r.data=dataDoRecibo(t,S.month);if(r.cands.length&&!r.valor)r.valor=String(r.cands[0]);r.erro=''}catch(e){r.erro=e.message}}
  }catch(e){r.erro=e.message}
  if(w){try{await w.terminate()}catch(e){}}
  r.lendo=false;
  const u=U();if(r.data&&u&&u.entries.some(e=>e.date===r.data))r.dia=r.data;
  if(S.view==='comp')render();
}

function shRef(t,de,n){return t.replace(/(\$?[A-Z]{1,3}\$?)(\d+)/g,(m,a,r)=>+r>=de?a+(+r+n):m)}
function ajustaLinhas(xml,modelo,antes,n){
  if(!n)return xml;
  let mm='',novas='',nm=0;
  if(n<0){/* menos lançamentos que o modelo: apaga as últimas linhas do bloco */
    const ini=antes+n;
    xml=xml.replace(/<row r="(\d+)"[^>]*>.*?<\/row>/gs,(m,r)=>+r>=ini&&+r<antes?'':m);
    xml=xml.replace(/<mergeCell ref="[A-Z]+(\d+):[A-Z]+\d+"\/>/g,(m,a)=>+a>=ini&&+a<antes?(nm--,''):m);
  }else{/* mais lançamentos: copia o formato da última linha do bloco */
    const row=xml.match(new RegExp('<row r="'+modelo+'"[^>]*>.*?</row>','s'))[0];
    const mods=[...xml.matchAll(new RegExp('<mergeCell ref="([A-Z]+)'+modelo+':([A-Z]+)'+modelo+'"/>','g'))].map(m=>[m[1],m[2]]);
    for(let i=0;i<n;i++){
      const r=antes+i;
      novas+=row.replace(/<row r="\d+"/,()=>'<row r="'+r+'"').replace(/<c r="([A-Z]+)\d+"/g,(m,c)=>'<c r="'+c+r+'"');
      mods.forEach(([a,b])=>{mm+='<mergeCell ref="'+a+r+':'+b+r+'"/>';nm++});
    }
  }
  xml=xml.replace(/<row r="(\d+)"/g,(m,r)=>+r>=antes?'<row r="'+(+r+n)+'"':m)
    .replace(/<c r="([A-Z]+)(\d+)"/g,(m,c,r)=>+r>=antes?'<c r="'+c+(+r+n)+'"':m)
    .replace(/(<f[^>]*>)([^<]*)(<\/f>)/g,(m,a,b,c)=>a+shRef(b,antes,n)+c)
    .replace(/(<formula[12]>)([^<]*)(<\/formula[12]>)/g,(m,a,b,c)=>a+shRef(b,antes,n)+c)
    .replace(/(sqref|ref)="([^"]*)"/g,(m,a,b)=>a+'="'+shRef(b,antes,n)+'"');
  if(novas)xml=xml.replace('<row r="'+(antes+n)+'"',()=>novas+'<row r="'+(antes+n)+'"');
  return xml.replace('</mergeCells>',()=>mm+'</mergeCells>').replace(/<mergeCells count="(\d+)"/,(m,c)=>'<mergeCells count="'+(+c+nm)+'"');
}
/* Solicitação: o modelo tem 2 linhas (Telmex) e 8 (CFTV); o app aumenta ou diminui os blocos conforme os lançamentos do mês */
async function openSolic(nT,nC){
  await lib('jszip');
  const zip=await JSZip.loadAsync(TPL.solic,{base64:true});
  let xml=await zip.file('xl/worksheets/sheet1.xml').async('string');
  let wb=await zip.file('xl/workbook.xml').async('string');
  let dr=await zip.file('xl/drawings/drawing1.xml').async('string');
  const ins=[[47,48,nC],[32,33,nT]];/* de baixo para cima, para os números de linha do modelo continuarem valendo */
  for(const[modelo,antes,n]of ins){
    if(!n)continue;
    xml=ajustaLinhas(xml,modelo,antes,n);
    wb=wb.replace(/(<definedName[^>]*>)([^<]*)(<\/definedName>)/g,(m,a,b,c)=>a+shRef(b,antes,n)+c);
    dr=dr.replace(/<xdr:row>(\d+)<\/xdr:row>/g,(m,r)=>+r+1>=antes?'<xdr:row>'+(+r+n)+'</xdr:row>':m);
  }
  zip.file('xl/workbook.xml',wb);zip.file('xl/drawings/drawing1.xml',dr);
  return{zip,sheet:new Sheet(xml)};
}

async function montaComprovPdf(u){
  await lib('pdflib');const{PDFDocument}=PDFLib;const out=await PDFDocument.create();
  const font=await out.embedFont(PDFLib.StandardFonts.Helvetica);
  const paginaImg=(img,leg)=>{
    const land=img.width>img.height;const W=land?841.89:595.28,H=land?595.28:841.89,m=28,topo=leg?22:0;
    const sc=Math.min((W-2*m)/img.width,(H-2*m-topo)/img.height);const w=img.width*sc,h=img.height*sc;
    const pg=out.addPage([W,H]);
    if(leg){let sz=12;while(sz>7&&font.widthOfTextAtSize(leg,sz)>W-2*m)sz-=0.5;pg.drawText(leg,{x:m,y:H-m-8,size:sz,font})}
    pg.drawImage(img,{x:(W-w)/2,y:H-m-topo-h,width:w,height:h});
  };
  for(const e of u.entries.filter(x=>x.date.startsWith(S.month)).sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id))for(const f of(e.fotos||[])){
    const dataUrl=await fotoGet(f.id);if(!dataUrl)continue;
    const bytes=Uint8Array.from(atob(dataUrl.split(',')[1]),ch=>ch.charCodeAt(0));const img=await out.embedJpg(bytes);
    paginaImg(img,f.tipo==='tag'?`Fatura da tag - pagina ${f.pag||''}`:`${fmtBR(e.date)} - ${(t=>t.charAt(0)+t.slice(1).toLowerCase())((TIPOS[f.tipo]||TIPOS.pedagio)[1])}${f.tipo==='outros'&&e.outrosDesc?' ('+String(e.outrosDesc).normalize('NFD').replace(/[^\x20-\x7e]/g,'')+')':''}${f.valor?' - R$ '+num(f.valor):''}${f.chamado?' - Chamado '+f.chamado:''}`);
  }
  for(const f of comprovFiles){
    const buf=await f.arrayBuffer();
    if(esPdf(f)){
      const d=await PDFDocument.load(buf,{ignoreEncryption:true});
      const pgs=await out.copyPages(d,d.getPageIndices());pgs.forEach(p=>out.addPage(p));
    }else{
      const du=await imgPronta(f,{max:2000,q:.82,rot:0,crop:false});
      const img=await out.embedJpg(Uint8Array.from(atob(du.split(',')[1]),ch=>ch.charCodeAt(0)));
      paginaImg(img,'');
    }
  }
  return out.getPageCount()?await out.save():null;
}

async function paginasComoFotos(file){

function etapa(nome){

  const pinta=()=>{const el=document.getElementById('etapa');if(el&&ETAPA)el.textContent=ETAPA+'… '+Math.round((performance.now()-ETAPA_T)/1000)+' s'};

    /* a lista de acessos e os dados do técnico são lidos ao mesmo tempo (quem não é técnico tem a leitura negada, e isso é ignorado) */
    const meuP=carregarUsuario(user.uid,true,user).catch(()=>null);
    const snap=await ref.get();let cfg=snap.exists?snap.data():null;
    if(!cfg&&email===ADMIN_EMAIL.toLowerCase()){cfg={admins:[email],supervisores:[],emails:[email]};await ref.set(cfg)}
    cfg=cfg||{};const low=a=>(a||[]).map(x=>String(x).trim().toLowerCase());
    const adm=low(cfg.admins).includes(email)||email===ADMIN_EMAIL.toLowerCase();
    const sup=adm||low(cfg.supervisores).includes(email);const tec=low(cfg.emails).includes(email);
    if(!tec&&!sup){let pedido=false;try{await fb.db.doc('pedidos/'+user.uid).set({email,nome:String(user.displayName||'').slice(0,80),quando:new Date().toISOString()});pedido=true}catch(e){}if(pedido)avisaAdmin(user);AUTH={status:'blocked',email,nome:user.displayName||'',pedido};return render()}
    AUTH={status:'ok',user,uid:user.uid,email,nome:user.displayName||'',acesso:{tecnico:tec,supervisor:sup,admin:adm},cfg};
    S.me=user.uid;S.mine=null;
    if(tec)S.mine=(await meuP)||await carregarUsuario(user.uid,true,user);
    S.role=tec?'tecnico':(sup?'supervisor':'admin');
    await aplicaPapel();etapa('');
    const total=Math.round(performance.now());console.log('Abertura: '+tempos()+' · total '+(total/1000).toFixed(1)+' s');
    if(adm&&total>6000)AUTH.lento='Abertura lenta ('+(total/1000).toFixed(0)+' s): '+tempos();
    render();

}
async function carregarUsuario(uid,todos,authUser,mes){
  const ref=fb.db.doc('users/'+uid);
  /* documento do técnico e meses lidos em paralelo */
  const mesesP=todos?ref.collection('meses').get().then(s=>s.docs):ref.collection('meses').doc(mes).get().then(m=>m.exists?[m]:[]);
  const[d,docsLidos]=await Promise.all([ref.get(),mesesP]);const x=d.exists?d.data():null;
  const u={profile:{...perfilVazio(authUser),...((x&&x.profile)||{})},addresses:(x&&x.addresses)||[],tag:(x&&x.tag)||[],entries:[],status:{},adiant:{}};
  if(!x&&authUser)u._novo=true;
  const docs=docsLidos;
  docs.forEach(m=>{const y=m.data();(y.entries||[]).forEach(e=>u.entries.push(e));u.status[m.id]=y.status||{s:'Rascunho',motivo:''};if(y.adiant!==null&&y.adiant!==undefined)u.adiant[m.id]=y.adiant});
  if(todos&&authUser){
    docs.forEach(m=>{lastW['m:'+uid+m.id]=JSON.stringify(docMes(u,m.id))});
    if(x)lastW['u:'+uid]=JSON.stringify(baseDoc(u));
  }
  return u;
}

function temPendencia(){
  const u=S.mine;if(!u)return false;const uid=S.me;

  const meses=new Set([...u.entries.map(e=>e.date.slice(0,7)),...Object.keys(u.status||{}),...Object.keys(u.adiant||{})]);
  for(const m of meses){const d=docMes(u,m);const vazio=!d.entries.length&&d.status.s==='Rascunho'&&d.adiant===null;if(lastW['m:'+uid+m]!==JSON.stringify(d)&&!(vazio&&lastW['m:'+uid+m]===undefined))return true}

async function nuvemSave(){
  const u=S.mine;if(!u||!AUTH.acesso||!AUTH.acesso.tecnico)return;
  try{
    const uid=S.me;const ts=firebase.firestore.FieldValue.serverTimestamp();
    const base=baseDoc(u);const jb=JSON.stringify(base);
    if(lastW['u:'+uid]!==jb){await fb.db.doc('users/'+uid).set({...limpo(base),atualizado:ts},{merge:true});lastW['u:'+uid]=jb}
    const meses=new Set([...u.entries.map(e=>e.date.slice(0,7)),...Object.keys(u.status||{}),...Object.keys(u.adiant||{})]);
    for(const m of meses){
      const d=docMes(u,m);const j=JSON.stringify(d);const k='m:'+uid+m;
      if(lastW[k]===j)continue;
      if(!d.entries.length&&d.status.s==='Rascunho'&&d.adiant===null&&lastW[k]===undefined)continue;
      await fb.db.doc(`users/${uid}/meses/${m}`).set({...limpo(d),atualizado:ts});lastW[k]=j;
    }

  }catch(e){console.error(e);setSync('erro',e.message);toast('Não consegui salvar na nuvem: '+e.message)}

let DRAFT={};try{DRAFT=JSON.parse(sessionStorage.getItem('reembolso-draft')||'{}')||{}}catch(e){DRAFT={}}
function draftKey(f){const k=f.dataset.form;return k==='entry'?'entry:'+(editId||'new'):k}
function draftPersist(){try{sessionStorage.setItem('reembolso-draft',JSON.stringify(DRAFT))}catch(e){}}
function draftClear(key){if(key){delete DRAFT[key]}else DRAFT={};draftPersist()}
function draftSave(f){
  const k=f.dataset.form;if(k!=='entry'&&k!=='end')return;
  const d={v:{},stops:[],det:!!(f.querySelector('details')&&f.querySelector('details').open)};
  for(const el of f.elements){if(!el.name||el.name==='stop'||el.type==='file'||el.type==='submit'||el.type==='button')continue;d.v[el.name]=el.value}
  d.stops=[...f.querySelectorAll('.stops .s')].map(r=>({v:r.querySelector('select').value,ch:r.dataset.ch||'',proj:r.dataset.proj||''}));
  d.fotos=k==='entry'?fotosForm.slice():null;
  const nova=JSON.stringify(d);if(DRAFT[draftKey(f)]&&JSON.stringify(DRAFT[draftKey(f)])===nova)return;
  DRAFT[draftKey(f)]=d;draftPersist();
}
function draftRestore(){
  document.querySelectorAll('form[data-form=entry],form[data-form=end]').forEach(f=>{
    const d=DRAFT[draftKey(f)];if(!d)return;
    for(const[n,v]of Object.entries(d.v)){const el=f.elements[n];if(el&&el instanceof HTMLElement)el.value=v}
    const box=f.querySelector('.stops');
    if(box&&d.stops&&d.stops.length){
      const add=box.querySelector('[data-act=addstop]');
      let rows=box.querySelectorAll('.s');
      while(rows.length<d.stops.length){const c=rows[0].cloneNode(true);add.before(c);rows=box.querySelectorAll('.s')}
      while(rows.length>d.stops.length){rows[rows.length-1].remove();rows=box.querySelectorAll('.s')}
      rows.forEach((r,i)=>{const x=d.stops[i];r.querySelector('select').value=x.v;r.dataset.ch=x.ch;r.dataset.proj=x.proj});
    }
    const det=f.querySelector('details');if(det&&d.det)det.open=true;
    if(d.fotos){fotosForm=d.fotos.slice();drawFotos()}
    if(f.dataset.form==='entry')atualizaSplit(f);
  });
}

      <div class="grid2"><div class="field"><label class="f">Km do projeto CFTV BRADESCO</label><input type="number" name="kmCFTV" min="0" step="1" inputmode="numeric" value="${e&&e.split?e.split['CFTV BRADESCO']||0:''}"></div>
      <div class="field"><label class="f">Km do projeto TELMEX</label><input type="number" name="kmTELMEX" min="0" step="1" inputmode="numeric" value="${e&&e.split?e.split['TELMEX']||0:''}"></div></div></div>
    <div class="row" style="margin:-4px 0 12px"><button type="button" class="btn sm" data-act="calckm">Calcular km automático</button><button type="button" class="btn sm ghost" data-act="maps">Conferir no Google Maps</button><span class="small muted" id="kmMsg"></span></div>
    <div class="row"><button class="btn primary" type="submit">${e?'Salvar alterações':'Salvar lançamento'}</button>${e?'<button class="btn" type="button" data-act="cancel">Cancelar</button>':''}</div>
  </form>`}
  ${!locked?Object.entries(c.rows.reduce((o,x)=>(o[x.date]=(o[x.date]||0)+1,o),{})).filter(([,n])=>n>1).map(([d,n])=>`<div class="msg warn" style="margin-top:14px"><b>${fmtBR(d)}: ${n} lançamentos no mesmo dia.</b> Cada um conta ida e volta para casa. Junte em um só trajeto (casa → cliente 1 → cliente 2 → casa).<div style="margin-top:8px"><button class="btn sm primary" data-act="juntar" data-d="${d}">Juntar em um só trajeto</button></div></div>`).join(''):''}

        <div class="tr">${esc(x.trajeto)}</div>${x.split?`<div class="small muted" style="margin-top:4px">Km por projeto: ${Object.entries(x.split).map(([p,k])=>PROJ[p].curto+' '+k).join(' · ')}</div>`:''}${x.fotos&&x.fotos.length?`<div class="small muted" style="margin-top:4px">${x.fotos.length} comprovante(s) em foto anexado(s)</div>`:''}
        <div class="row small" style="margin-top:8px"><span class="muted">${brl(r2(x.km*FATOR))} km${+x.pedagio?` · pedágio ${brl(x.pedagio)}`:''}${+x.estac?` · estac. ${brl(x.estac)}`:''}${EXTRAS.filter(k=>+x[k]>0).map(k=>` · ${TIPOS[k][0].toLowerCase()} ${brl(x[k])}`).join('')}</span><span class="spacer"></span>

/* ----- Prévia das planilhas ----- */
function vMes(){
  const u=U();if(!u)return'<div class="empty">Nenhum técnico cadastrado.</div>';const c=calc(u,S.month);const st=stat(u,S.month);const pr=problemas(u,S.month);
  const sup=S.role==='supervisor';const bloq=pr.some(x=>x.l==='err');
  const tabs=[['controle','Controle de despesas'],['km','Reembolso KM'],['solic','Solicitação de Reembolso']];
  const nomes=nomeArquivos(u,S.month);
  let prev='';
  if(prevTab==='controle')prev=pvControle(u,c);
  else if(prevTab==='km')prev=pvKm(u,c);
  else prev=pvSolic(u,c);
  return`
  <h1 class="page">${sup?esc(u.profile.nome):'Meu mês'}</h1>
  <p class="muted small" style="margin:0">Prévia das planilhas, com os mesmos dados que serão gravados nos modelos originais. <span class="chip ${st.s}">${st.s}</span></p>
  <div class="card">
    <div class="field" style="max-width:320px"><label class="f">Adiantamento recebido em ${MESES[+S.month.split('-')[1]-1]}/${S.month.slice(0,4)} (R$)</label>
      <input type="text" name="adiantMes" inputmode="decimal" value="${String(c.adiant).replace('.',',')}" ${(sup||!['Rascunho','Ajuste'].includes(st.s))?'disabled':''}>
      <div class="small muted" style="margin-top:4px">Vale só para este mês. Meses anteriores não mudam. Padrão do perfil: ${brl(u.profile.adiantamento)}.</div></div>
    <div class="stats">
      <div class="stat"><b>${c.km}</b><span>km no mês</span></div>
      <div class="stat"><b>${brl(c.valorKm)}</b><span>valor do km (× 0,99)</span></div>
      <div class="stat"><b>${brl(c.desp)}</b><span>${c.extras>0?'pedágio, estac. e '+(EXTRAS.length===1?TIPOS[EXTRAS[0]][0].toLowerCase():'outras despesas'):'pedágio + estacionamento'}</span></div>
      <div class="stat"><b>${brl(c.total)}</b><span>total da prestação</span></div>
      <div class="stat"><b>${brl(c.adiant)}</b><span>adiantamento</span></div>
      <div class="stat"><b>${brl(c.dif)}</b><span>${c.dif>=0?'a restituir ao colaborador':'a restituir à empresa'}</span></div>
    </div>
    ${pr.map(x=>`<div class="msg ${x.l}">${esc(x.m)}</div>`).join('')}
  </div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${prevTab===t[0]?'on':''}" data-act="ptab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${prev}
  <div class="card">
    <h2>Gerar arquivos</h2>
    <p class="sub">Planilhas no mesmo layout dos modelos (a Solicitação sai em .xlsm, com as macros do original: habilite o conteúdo ao abrir). O .zip leva 5 arquivos: Controle, Reembolso KM (planilha e PDF), Solicitação e o PDF unificado dos comprovantes (se houver recibos aplicados ou arquivos anexados). Abra no Excel para conferir antes de enviar.</p>
    <div class="row">
      <button class="btn primary" data-act="gen" data-k="zip" ${bloq?'disabled':''}>Baixar tudo (.zip)</button>
      <button class="btn" data-act="gen" data-k="controle" ${bloq?'disabled':''}>Controle</button>
      <button class="btn" data-act="gen" data-k="km" ${bloq?'disabled':''}>Reembolso KM</button>
      <button class="btn" data-act="gen" data-k="kmPdf" ${bloq?'disabled':''}>Reembolso KM (PDF)</button>
      <button class="btn" data-act="gen" data-k="solic" ${bloq?'disabled':''}>Solicitação</button>
    </div>
    ${bloq?'<div class="msg err">Corrija os itens em vermelho para liberar o download.</div>':''}
    ${!sup?`<div class="row" style="margin-top:14px">
      ${['Rascunho','Ajuste'].includes(st.s)?`<button class="btn ok" data-act="enviar" ${bloq?'disabled':''}>Enviar para aprovação</button>`:`<span class="muted small">Status: ${st.s}.${st.s==='Enviado'?' Aguardando o supervisor.':''}</span>`}
      ${st.s==='Enviado'?'<button class="btn" data-act="recolher">Recolher envio</button>':''}
    </div>`:''}
  </div>`;
}
function pvControle(u,c){
  const ex=c.extras>0;
  const h=['Nome do Colaborador','Valor Adiantamento','Valor da Prestação','Diferença','Data do Atendimento','Nº do Chamado','Trajeto','Projeto','KM','Pedágio','Estacionamento',...(ex?[...EXTRAS.map(k=>TIPOS[k][0]),...(EXTRAS.includes('outros')?['Especificar Outros']:[])]:[])];
  return`<div class="tbl-wrap"><table><thead><tr>${h.map((x,i)=>`<th class="${i>=8||i>=1&&i<=3?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>
  ${c.rows.map(e=>`<tr><td>${esc(u.profile.nome)}</td><td class="n">${num(c.adiant)}</td><td class="n">${num(c.total)}</td><td class="n">${num(c.dif)}</td><td>${fmtBR(e.date)}</td><td>${esc(e.chamado)}</td><td style="min-width:320px">${esc(e.trajeto)}</td><td>${esc(projLabel(e))}</td><td class="n">${e.km}</td><td class="n">${+e.pedagio?num(e.pedagio):''}</td><td class="n">${+e.estac?num(e.estac):''}</td>${ex?EXTRAS.map(k=>`<td class="n">${+e[k]?num(e[k]):''}</td>`).join('')+(EXTRAS.includes('outros')?`<td>${esc(e.outrosDesc||'')}</td>`:''):''}</tr>`).join('')||'<tr><td colspan="11" class="empty">Sem lançamentos.</td></tr>'}
  </tbody></table></div>`;
}
function pvKm(u,c){
  const p=u.profile;const conf=S.role!=='tecnico';
  return(conf?`<div class="row small" style="margin:0 0 10px;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn sm" data-act="confkm">Conferir km de todos os dias</button><span id="confMsg" class="muted small">Recalcula cada dia pelo mapa e marca os que diferem do informado. Use o link "Google Maps" da linha para tirar a dúvida.</span><span id="confAct"></span></div>`:'')+`<div class="sheet-h"><div><b>Funcionário</b>${esc(p.nome)}</div><div><b>Matrícula</b>${esc(p.matricula)}</div><div><b>Empresa</b>Global Hitss</div></div>
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Data</th><th>Trajeto</th><th>Motivo</th><th class="n">Distância em km</th><th class="n">Fator</th>${conf?'<th>Google Maps</th><th>Conferência</th>':''}</tr></thead><tbody>
  ${c.rows.map((e,i)=>`<tr><td>${i+1}</td><td>${fmtBR(e.date)}</td><td style="min-width:320px">${esc(e.trajeto)}</td><td>${esc(motivoKm(e))}</td><td class="n">${e.km}</td><td class="n">${num(e.km*FATOR)}</td>${conf?`<td>${(e.stops||[]).length?`<a href="${linkMaps(p.home,e.stops)}" target="_blank" rel="noopener" style="color:var(--accent,#f43f5e)">Abrir rota</a>`:'—'}</td><td data-ck="${i}" class="small muted">—</td>`:''}</tr>`).join('')}
  <tr class="tot"><td colspan="4">Somatório da KM / Valor a receber</td><td class="n">${c.km}</td><td class="n">${num(c.km*FATOR)}</td>${conf?'<td></td><td></td>':''}</tr></tbody></table></div>`;
}
function pvSolic(u,c){
  const p=u.profile;const fim=fmtBR(ultimoDia(S.month));
  const kmL=['TELMEX','CFTV BRADESCO'].filter(k=>c.kmP[k]>0).map(k=>[fim,`${c.kmP[k]} KM ${PROJ[k].nome} * R$0,99`,c.valP[k]]);
  const sec=(tit,list,proj)=>`<tr><th colspan="4">${tit}</th></tr>`+list.map(x=>`<tr><td>${esc(x.nota||(x.semPlaca?'':p.placa))}</td><td>${fmtBR(x.date)}</td><td>DESPESAS ${PROJ[proj].nome} (${x.tipo})</td><td class="n">${num(x.valor)}</td></tr>`).join('')+`<tr class="tot"><td colspan="3">Total</td><td class="n">${num(list.reduce((s,x)=>s+x.valor,0))}</td></tr>`;
  return`<div class="sheet-h"><div><b>Nome</b>${esc(p.nome)}</div><div><b>CPF</b>${esc(p.cpf)}</div><div><b>Telefone</b>${esc(p.telefone)}</div><div><b>Nº do fornecedor</b>${esc(p.fornecedor)}</div><div><b>Área</b>${esc(p.area)}</div><div><b>Cargo</b>${esc(p.cargo)}</div><div><b>Local / Regional</b>${esc(p.local)} · ${esc(p.regional)}</div><div><b>Empresa</b>${esc(p.empresa)}</div><div><b>Centro de custo</b>${esc(p.centro)}</div><div><b>Total do adiantamento</b>${brl(c.adiant)}</div></div>
  <div class="msg info" style="margin:0 0 10px">${esc(p.motivoGasto)}</div>
  <div class="tbl-wrap"><table><tbody>
  <tr><th colspan="4">5132376010 - Transporte/quilômetro rodado - DESPESAS LOCAIS</th></tr>
  ${kmL.map(x=>`<tr><td></td><td>${x[0]}</td><td>${esc(x[1])}</td><td class="n">${num(x[2])}</td></tr>`).join('')}
  <tr class="tot"><td colspan="3">Total</td><td class="n">${num(c.valorKm)}</td></tr>
  ${sec('5132376110 - Estacionamento/pedágio - DESPESAS LOCAIS (Telmex)',c.exp.TELMEX,'TELMEX')}
  ${sec('6122376110 - Estacionamento/pedágio - DESPESAS LOCAIS (CFTV Bradesco)',c.exp['CFTV BRADESCO'],'CFTV BRADESCO')}
  ${c.alim>0?`<tr><th colspan="4">6132394020 - Alimentação - DESPESAS LOCAIS</th></tr>`+['TELMEX','CFTV BRADESCO'].filter(k=>c.alimP[k]>0).map(k=>`<tr><td></td><td>${fmtBR(c.alimD[k])}</td><td>${PROJ[k].nome}</td><td class="n">${num(c.alimP[k])}</td></tr>`).join('')+`<tr class="tot"><td colspan="3">Total</td><td class="n">${num(c.alim)}</td></tr>`:''}
  <tr><th colspan="4">Resultado do relatório</th></tr>
  <tr><td colspan="3">Total das despesas</td><td class="n">${num(c.total)}</td></tr>
  <tr><td colspan="3">Total de adiantamento</td><td class="n">${num(c.adiant)}</td></tr>
  <tr class="tot"><td colspan="3">${c.dif>=0?'Valor a restituir para o colaborador':'Valor a restituir para a empresa'}</td><td class="n">${num(Math.abs(c.dif))}</td></tr>
  </tbody></table></div>`;
}

/* ----- Comprovantes ----- */

    <div class="small muted" style="margin-top:6px">Arquivo: <b>${esc(nomeArquivos(U(),S.month).comprov)}</b>. O mês vem do seletor lá em cima.</div>
    <div class="list" style="margin-top:12px">${comprovFiles.length?comprovFiles.map((f,i)=>`<div class="item"><div class="t"><b>${esc(f.name)}</b><span class="small muted">${(f.size/1024).toFixed(0)} KB</span><span class="num"><button class="btn sm" data-act="rmfile" data-i="${i}">Remover</button></span></div></div>`).join(''):'<div class="empty">Nenhum arquivo anexado.</div>'}</div>
    <div class="msg info">${NUVEM?"Os arquivos anexados aqui ficam só na tela, para montar o PDF, e somem ao recarregar a página. Fotos de recibo aparecem abaixo para você aplicar o valor ao dia: aí elas ficam guardadas no lançamento.":"Nesta demonstração os arquivos ficam só na sua tela e não são enviados a nenhum servidor."}</div>

function vTag(){
  const u=U();const itens=u.tag||[];const dias=tagPorDia(itens);
  const totP=r2(dias.reduce((t,d)=>t+d.ped,0)),totE=r2(dias.reduce((t,d)=>t+d.est,0));
  return`<div class="card"><h2>Fatura da tag: pedágio e estacionamento</h2>
    <p class="sub">Leia a fatura (PDF "Histórico de lançamentos" da tag) para preencher pedágio e estacionamento de cada dia, somando as passagens da mesma data.</p>
    <div class="row"><button class="btn" data-act="lertag" ${comprovFiles.some(esPdf)?'':'disabled'}>Ler fatura dos PDFs anexados</button>
    ${dias.length?`<button class="btn primary" data-act="aplicartag">Aplicar nos lançamentos</button><button class="btn ghost" data-act="limpartag">Limpar</button>`:''}</div>
    <div id="tagMsg" class="small muted" style="margin-top:8px">${comprovFiles.some(esPdf)?'':'Anexe o PDF da fatura acima.'}</div>
    ${dias.length?`<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Data</th><th class="n">Pedágio</th><th class="n">Estacionamento</th><th>Lançamento no dia</th></tr></thead><tbody>
    ${dias.map(d=>{const ex=u.entries.some(e=>e.date===d.date);return`<tr><td>${fmtBR(d.date)}</td><td class="n">${d.np?num(d.ped)+' ('+d.np+')':''}</td><td class="n">${d.ne?num(d.est)+' ('+d.ne+')':''}</td><td>${ex?'<span class="chip Aprovado">tem</span>':'<span class="chip Ajuste">sem lançamento</span>'}</td></tr>`}).join('')}

    ${[['nome','Nome'],['matricula','Matrícula'],['cpf','CPF'],['telefone','Telefone'],['fornecedor','Nº do fornecedor'],['area','Área'],['cargo','Cargo'],['local','Local de negócio'],['regional','Regional'],['empresa','Empresa'],['centro','Centro de custo'],['adiantamento','Adiantamento padrão (R$): usado nos meses sem valor próprio'],['placa','Placa do veículo (comprovantes)']].map(([k,l])=>`<div class="field"><label class="f">${l}</label><input type="text" name="${k}" value="${esc(p[k])}"></div>`).join('')}

function download(name,data,type){
  const b=new Blob([data],{type:type||'application/octet-stream'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

    toast(msg)
  }
  else if(a==='pick'){/* input próprio, fora do render: se a tela redesenhar (sincronização) enquanto o seletor está aberto, o arquivo não se perde */
    const inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,image/jpeg,image/png,.pdf';inp.multiple=true;inp.style.display='none';document.body.appendChild(inp);
    inp.addEventListener('change',()=>{const novos=[...inp.files];inp.remove();if(!novos.length)return;comprovFiles.push(...novos);addRecibos(novos);save();render()});
    inp.addEventListener('cancel',()=>inp.remove());
    inp.click();return}
  else if(a==='rmfile'){const rf=comprovFiles[+b.dataset.i];RECIBOS=RECIBOS.filter(x=>x.file!==rf);comprovFiles.splice(+b.dataset.i,1)}
  else if(a==='reciboRot'){const r=RECIBOS[+b.dataset.i];if(!r)return;r.rot=((r.rot||0)+(+b.dataset.d)+360)%360;try{r.img=await imgPequena(r.file,r.rot)}catch(e){toast('Não consegui girar')}}
  else if(a==='reciboRm'){const r=RECIBOS.splice(+b.dataset.i,1)[0];const k=comprovFiles.indexOf(r.file);if(k>=0)comprovFiles.splice(k,1)}
  else if(a==='reciboCand'){RECIBOS[+b.dataset.i].valor=b.dataset.v}
  else if(a==='reciboOk'){
    const r=RECIBOS[+b.dataset.i];if(!r)return;const v=r2(+String(r.valor).replace(',','.')||0);
    if(!r.dia){toast('Escolha o dia do lançamento');return}
    if(!(v>0)){toast('Informe o valor');return}
    if(!r.img){toast('Não consegui ler a imagem');return}
    const e=u.entries.find(x=>x.date===r.dia);if(!e){toast('Lançamento não encontrado');return}
    const chs=String(e.chamado||'').split(' / ').map(x=>x.trim()).filter(Boolean);
    if(chs.length>1&&!r.chamado){toast('Escolha o chamado deste recibo');return}
    const chamado=chs.length?(r.chamado==='*'?chs.join(' / '):(r.chamado||chs[0])):'';
    const fid='f'+newId().toString(36);
    try{await fotoPut(fid,r.img)}catch(err){toast('Não foi possível salvar a foto: '+err.message);return}
    e.fotos=e.fotos||[];e.fotos.push({id:fid,tipo:r.tipo,valor:v,chamado});
    const campo=campoTipo(r.tipo);e[campo]=r2((+e[campo]||0)+v);
    RECIBOS.splice(+b.dataset.i,1);const k=comprovFiles.indexOf(r.file);if(k>=0)comprovFiles.splice(k,1);
    toast('Aplicado em '+fmtBR(r.dia))}
  else if(a==='merge'){
    try{
      const bytes=await montaComprovPdf(u);
      if(!bytes){toast('Não há comprovantes para juntar neste mês');return}
      download(nomeArquivos(u,S.month).comprov,bytes,'application/pdf');toast('PDF gerado');
    }catch(e){console.error(e);toast('Erro ao juntar: '+e.message)}
    return;
  }
  save();render();
});

document.addEventListener('input',ev=>{
  const t=ev.target;if(t.name==='kmCFTV'||t.name==='kmTELMEX'){const f=t.form;f.elements.km.value=(+f.elements.kmCFTV.value||0)+(+f.elements.kmTELMEX.value||0)}
  if(t.dataset&&t.dataset.ri!==undefined&&RECIBOS[+t.dataset.ri]){RECIBOS[+t.dataset.ri][t.dataset.rf]=t.value;if(t.dataset.rf==='dia'){RECIBOS[+t.dataset.ri].chamado='';render()}}
  // salva o cadastro enquanto digita (não perde ao trocar de tela)
  const fm=t.form&&t.form.dataset&&t.form.dataset.form;
  if(fm==='perfil'&&t.name){const u=U();if(u){const v=String(t.value);u.profile[t.name]=t.name==='adiantamento'?(+v.replace(',','.')||0):v.trim();save()}}
  else if(fm==='home'&&t.name==='home'){const u=U();if(u){u.profile.home=String(t.value).trim();save()}}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='fotoIn'){const fl=t.files[0];t.value='';if(fl)lerFoto(fl);return}
  if(t.id==='fileIn'){const novos=[...t.files];comprovFiles.push(...novos);addRecibos(novos);save();render();return}
  if(t.name==='adiantMes'){const u=U();u.adiant=u.adiant||{};const v=String(t.value).trim();
    if(v==='')delete u.adiant[S.month];else u.adiant[S.month]=Math.max(0,+v.replace(/\./g,'').replace(',','.')||0);
    save();render();return}
  if(t.name==='projeto'&&t.form){atualizaSplit(t.form);return}
  if(t.name==='chamado'&&t.form){
    const l=t.value.split(/\s*[\/,;]\s*/).filter(Boolean);
    if(l.length&&l.every(x=>/^1-/.test(x)))t.form.elements.projeto.value='TELMEX';
    else if(l.length&&l.every(x=>/^F\d/i.test(x)))t.form.elements.projeto.value='CFTV BRADESCO';
    atualizaSplit(t.form);return}
  const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='role'){S.role=t.value;if(NUVEM){try{await aplicaPapel()}catch(err){toast(err.message)}}else{S.view=null;if(S.role==='tecnico')S.userId='u1'}}
  else if(a==='user'){S.userId=t.value}
  else if(a==='mm'||a==='yy'){
    let[y,m]=S.month.split('-');
    if(a==='mm')m=String(t.value).padStart(2,'0');else y=t.value;
    S.month=`${y}-${m}`;editId=null;
    if(NUVEM&&S.role==='supervisor'){try{await carregarTodos();S.users=S.sup;if(!S.users[S.userId])S.userId=Object.keys(S.users)[0]||null}catch(err){toast(err.message)}}
  }
  save();render();
});

document.addEventListener('submit',async ev=>{
  const f=ev.target;const kind=f.dataset.form;if(!kind)return;
  const dk=draftKey(f);
  const u=U();const fd=new FormData(f);
  if(kind==='entry'){
    ev.preventDefault();
    const stops=fd.getAll('stop').filter(Boolean);
    if(!stops.length){toast('Escolha ao menos um endereço');return}
    const obj={notaPed:String(fd.get('notaPed')||'').trim(),notaEst:String(fd.get('notaEst')||'').trim(),date:fd.get('date'),projeto:fd.get('projeto'),chamado:String(fd.get('chamado')||'').trim(),stops,
      km:+fd.get('km')||0,pedagio:+fd.get('pedagio')||0,estac:+fd.get('estac')||0,
      hosp:+fd.get('hosp')||0,alim:+fd.get('alim')||0,material:+fd.get('material')||0,outros:+fd.get('outros')||0,outrosDesc:String(fd.get('outrosDesc')||'').trim()};
    if(pendingFoto){toast('Confirme ou descarte a foto do comprovante');return}
    obj.fotos=fotosForm.slice();
    const linhas=linhasParadas(f);
    obj.metas=linhas.map(r=>({ch:r.dataset.ch||'',proj:projDaLinha(f,r)}));
    const ps=[...new Set(obj.metas.map(m=>m.proj))];
    if(ps.length>1){
      obj.split={'CFTV BRADESCO':+fd.get('kmCFTV')||0,'TELMEX':+fd.get('kmTELMEX')||0};
      obj.km=obj.split['CFTV BRADESCO']+obj.split['TELMEX'];
      if(!(obj.km>0)){toast('Informe o km de cada projeto');return}
    }else obj.split=null;
    if(editId){const e=u.entries.find(x=>x.id===editId);Object.assign(e,obj);editId=null}
    else{obj.id=newId();u.entries.push(obj)}
    {const stx=stat(u,obj.date.slice(0,7));if(stx.s==='Ajuste'&&diasAjuste(stx,obj.date.slice(0,7)).has(obj.date)){stx.feitos=[...new Set([...(stx.feitos||[]),obj.date])]}}
    if(!obj.date.startsWith(S.month))S.month=obj.date.slice(0,7);
    toast('Lançamento salvo');
  }else if(kind==='home'){ev.preventDefault();u.profile.home=String(fd.get('home')).trim();toast('Residência salva')}
  else if(kind==='end'){ev.preventDefault();u.addresses.push({id:newId(),nome:String(fd.get('nome')).trim(),end:String(fd.get('end')).trim()});toast('Local adicionado')}
  else if(kind==='acessos'){
    ev.preventDefault();
    const lista=n=>[...new Set(String(fd.get(n)||'').split(/[\n,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];
    const cfg={emails:lista('emails'),supervisores:lista('supervisores'),admins:lista('admins')};
    if(!cfg.admins.includes(AUTH.email))cfg.admins.push(AUTH.email);
    try{await fb.db.doc('config/acesso').set(cfg);AUTH.cfg=cfg;toast('Acessos salvos')}catch(err){toast('Não foi possível salvar: '+err.message)}
    render();return;
  }
  else if(kind==='perfil'){ev.preventDefault();delete u._novo;for(const[k,v]of fd.entries())u.profile[k]=k==='adiantamento'?(+String(v).replace(',','.')||0):String(v).trim();toast('Dados salvos')}
  else if(kind==='ajuste'){
    const sub=ev.submitter&&ev.submitter.value;
    if(sub==='ok'&&ajusteId){const st=stat(S.users[ajusteId],S.month);st.s='Ajuste';st.motivo=String(fd.get('motivo')).trim();st.dias=S._ajDias&&S._ajDias.length?S._ajDias.slice():[];st.feitos=[];S._ajDias=null;persistStatus(ajusteId);toast('Ajuste solicitado')}
  }
  if(kind==='entry'||kind==='end')draftClear(dk);
  save();render();
});

load();render();if(NUVEM)iniciarNuvem();setTimeout(()=>{lib('jszip').catch(()=>{});lib('pdflib').catch(()=>{})},2500);
window.__app={valoresDe,lerTag,tagPorDia,variantes,kmRota,parseChamado,calc,problemas,genControle,genKm,genSolic,gerarTodas,trajeto,get S(){return S},set S(v){S=v}};
</script>
