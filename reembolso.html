<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reembolso de Campo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef0f4; --text:#15181e; --muted:#5d6675; --line:#dde1e8;
  --brand:#c8102e; --brand-ink:#ffffff; --brand-soft:#fdecef;
  --ok:#17803d; --ok-soft:#e6f5ec; --warn:#a15c00; --warn-soft:#fff3dc; --err:#b42318; --err-soft:#fde9e7; --info:#1d4ed8; --info-soft:#e8eefc;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b21; --surface2:#222630; --text:#eceef2; --muted:#9aa3b2; --line:#2c313c;
    --brand:#ef4a63; --brand-ink:#16080b; --brand-soft:#33151b;
    --ok:#4ccf80; --ok-soft:#13281b; --warn:#f2b44d; --warn-soft:#2b2210; --err:#ff8a7d; --err-soft:#33191a; --info:#8fb0ff; --info-soft:#18223a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b21; --surface2:#222630; --text:#eceef2; --muted:#9aa3b2; --line:#2c313c;
  --brand:#ef4a63; --brand-ink:#16080b; --brand-soft:#33151b;
  --ok:#4ccf80; --ok-soft:#13281b; --warn:#f2b44d; --warn-soft:#2b2210; --err:#ff8a7d; --err-soft:#33191a; --info:#8fb0ff; --info-soft:#18223a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:960px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.demo{font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
select,input[type=text],input[type=number],input[type=date],input[type=month],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
select{width:auto}
textarea{min-height:76px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:0 0 4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card h2{margin:0 0 4px;font-size:17px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
h1.page{font-size:22px;margin:18px 0 2px;letter-spacing:-.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.Rascunho{background:var(--surface2);color:var(--muted)}
.chip.Enviado{background:var(--info-soft);color:var(--info)}
.chip.Ajuste{background:var(--warn-soft);color:var(--warn)}
.chip.Aprovado{background:var(--ok-soft);color:var(--ok)}
.chip.Pago{background:var(--ok);color:#fff}
.chip.TELMEX{background:var(--info-soft);color:var(--info)}
.chip.CFTV{background:var(--brand-soft);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;letter-spacing:-.3px}
.stat span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.item .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .tr{color:var(--muted);font-size:13px;margin-top:6px;word-break:break-word}
.item .num{margin-left:auto;font-weight:700}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--info-soft);color:var(--info)}
.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0 10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;min-height:40px}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:700;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;background:var(--surface2)}
.sheet-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:10px}
.sheet-h div{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:13px}
.sheet-h b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:960px;margin:0 auto;display:flex}
nav.bottom button{flex:1;border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-height:56px}
nav.bottom button.on{color:var(--brand)}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.stops .s{display:flex;gap:8px;margin-bottom:8px}
.stops .s select{flex:1;width:100%}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);max-width:520px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bottom"><div class="in" id="nav"></div></nav>
<div id="toast"></div>

/* ============================================================
   MOTOR DE PREENCHIMENTO: edita só as células de dados do XML
   das planilhas originais, preservando formatação, logos e mesclas
   ============================================================ */
const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const colToN=c=>{let n=0;for(const ch of c)n=n*26+ch.charCodeAt(0)-64;return n};
const splitRef=r=>{const m=/^([A-Z]+)(\d+)$/.exec(r);return[m[1],+m[2]]};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const serial=(iso)=>{const[y,m,d]=iso.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000)};

class Sheet{
  constructor(xml){
    this.doc=new DOMParser().parseFromString(xml,'application/xml');
    this.sd=this.doc.getElementsByTagNameNS(NS,'sheetData')[0];
  }
  row(r){
    let before=null;
    for(const el of this.sd.children){
      const n=+el.getAttribute('r');
      if(n===r)return el;
      if(n>r){before=el;break}
    }
    const el=this.doc.createElementNS(NS,'row');el.setAttribute('r',r);
    this.sd.insertBefore(el,before);return el;
  }
  cell(ref){
    const[col,r]=splitRef(ref);const row=this.row(r);const cn=colToN(col);let before=null;
    for(const c of row.children){
      const[cc]=splitRef(c.getAttribute('r'));const n=colToN(cc);
      if(n===cn)return c;
      if(n>cn){before=c;break}
    }
    const c=this.doc.createElementNS(NS,'c');c.setAttribute('r',ref);
    row.insertBefore(c,before);return c;
  }
  style(ref){return this.cell(ref).getAttribute('s')}
  set(ref,v,style){
    const c=this.cell(ref);
    while(c.firstChild)c.removeChild(c.firstChild);
    c.removeAttribute('t');
    if(v!==null&&v!==undefined&&v!==''){
      if(typeof v==='number'){
        const e=this.doc.createElementNS(NS,'v');e.textContent=String(v);c.appendChild(e);
      }else{
        c.setAttribute('t','inlineStr');
        const is=this.doc.createElementNS(NS,'is');const t=this.doc.createElementNS(NS,'t');
        t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');
        t.textContent=String(v);is.appendChild(t);c.appendChild(is);
      }
    }
    if(style!==undefined&&style!==null)c.setAttribute('s',style);
  }
  height(r,ht){const el=this.row(r);el.setAttribute('ht',String(ht));el.setAttribute('customHeight','1')}
  xml(){return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+new XMLSerializer().serializeToString(this.doc).replace(/^<\?xml[^>]*\?>\s*/,'')}
}
class Styles{
  constructor(xml){
    this.doc=new DOMParser().parseFromString(xml,'application/xml');
    this.xfs=this.doc.getElementsByTagNameNS(NS,'cellXfs')[0];this.cache={};
  }
  wrap(idx){
    idx=+idx||0;
    if(this.cache[idx]!==undefined)return this.cache[idx];
    const n=this.xfs.children[idx].cloneNode(true);
    n.setAttribute('applyAlignment','1');
    let al=[...n.children].find(e=>e.localName==='alignment');
    if(!al){al=this.doc.createElementNS(NS,'alignment');n.insertBefore(al,n.firstChild)}
    al.setAttribute('wrapText','1');al.setAttribute('vertical','center');
    this.xfs.appendChild(n);
    this.xfs.setAttribute('count',String(this.xfs.children.length));
    return this.cache[idx]=this.xfs.children.length-1;
  }
  date(idx){
    idx=+idx||0;this.dc=this.dc||{};
    if(this.dc[idx]!==undefined)return this.dc[idx];
    const root=this.doc.documentElement;
    let nfs=this.doc.getElementsByTagNameNS(NS,'numFmts')[0];
    if(!nfs){nfs=this.doc.createElementNS(NS,'numFmts');root.insertBefore(nfs,root.firstChild)}
    let id=null,max=163;
    for(const n of nfs.children){const i=+n.getAttribute('numFmtId');if(i>max)max=i;if(n.getAttribute('formatCode')==='dd/mm/yyyy')id=i}
    if(id===null){id=max+1;const n=this.doc.createElementNS(NS,'numFmt');n.setAttribute('numFmtId',String(id));n.setAttribute('formatCode','dd/mm/yyyy');nfs.appendChild(n);nfs.setAttribute('count',String(nfs.children.length))}
    const x=this.xfs.children[idx].cloneNode(true);x.setAttribute('numFmtId',String(id));x.setAttribute('applyNumberFormat','1');
    this.xfs.appendChild(x);this.xfs.setAttribute('count',String(this.xfs.children.length));
    return this.dc[idx]=this.xfs.children.length-1;
  }
  xml(){return'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+new XMLSerializer().serializeToString(this.doc).replace(/^<\?xml[^>]*\?>\s*/,'')}
}
async function openTpl(key){
  const zip=await JSZip.loadAsync(TPL[key],{base64:true});
  const sheet=new Sheet(await zip.file('xl/worksheets/sheet1.xml').async('string'));
  return{zip,sheet};
}
async function saveTpl(zip,sheet,styles){
  zip.file('xl/worksheets/sheet1.xml',sheet.xml());
  if(styles)zip.file('xl/styles.xml',styles.xml());
  return zip.generateAsync({type:'uint8array',compression:'DEFLATE'});
}

/* ---------- regras de negócio ---------- */
const FATOR=0.99;
const PROJ={TELMEX:{label:'TELMEX',curto:'TELMEX',nome:'PROJETO TELMEX'},'CFTV BRADESCO':{label:'CFTV BRADESCO',curto:'CFTV',nome:'PROJETO CFTV BRADESCO'}};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const LIM={kmLinhas:25,solicKm:3,solicTelmex:3,solicCftv:9};

function trajeto(home,stops){
  const seq=[home,...stops,home];const L={};let n=0;const out=[];
  for(const a of seq){if(!(a in L))L[a]=String.fromCharCode(65+n++);out.push(L[a]+': '+a)}
  return out.join(' / ');
}
const projsDe=e=>[...new Set(((e.metas&&e.metas.length)?e.metas.map(m=>m.proj):[e.projeto]).filter(Boolean))];
const kmProj=e=>e.split?e.split:{[e.projeto]:+e.km||0};
const projLabel=e=>{const p=projsDe(e);return p.length>1?p.join(' / '):e.projeto};
const motivoKm=e=>{const p=projsDe(e);
  if(p.length>1)return e.metas.map(m=>`${m.ch||''} PROJETO ${PROJ[m.proj].curto}`.trim()).join(' / ');
  return`${(e.chamado||'').trim()} PROJETO ${PROJ[e.projeto].curto}`.trim()};
function ultimoDia(month){const[y,m]=month.split('-').map(Number);const d=new Date(Date.UTC(y,m,0));return d.toISOString().slice(0,10)}
const fmtBR=iso=>iso?iso.split('-').reverse().join('/'):'';
const brl=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function calc(user,month){
  const es=user.entries.filter(e=>e.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  const home=user.profile.home;
  const rows=es.map(e=>({...e,trajeto:trajeto(home,e.stops||[])}));
  const kmP={TELMEX:0,'CFTV BRADESCO':0};
  rows.forEach(e=>{const m=kmProj(e);for(const p in m)kmP[p]=(kmP[p]||0)+(+m[p]||0)});
  const valP={};Object.keys(kmP).forEach(p=>valP[p]=r2(kmP[p]*FATOR));
  const exp={TELMEX:[],'CFTV BRADESCO':[]};
  rows.forEach(e=>{
    if(+e.pedagio>0)exp[e.projeto].push({tipo:'PEDAGIO',date:e.date,valor:+e.pedagio,nota:String(e.notaPed||'').trim()});
    if(+e.estac>0)exp[e.projeto].push({tipo:'ESTAC.',date:e.date,valor:+e.estac,nota:String(e.notaEst||'').trim()});
  });
  Object.keys(exp).forEach(p=>exp[p].sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==='PEDAGIO'?-1:1)||a.date.localeCompare(b.date)));
  const km=kmP.TELMEX+kmP['CFTV BRADESCO'];
  const valorKm=r2(valP.TELMEX+valP['CFTV BRADESCO']);
  const ped=r2(rows.reduce((s,e)=>s+(+e.pedagio||0),0));
  const est=r2(rows.reduce((s,e)=>s+(+e.estac||0),0));
  const total=r2(valorKm+ped+est);
  const adiant=(user.adiant&&user.adiant[month]!==undefined&&user.adiant[month]!==null)?(+user.adiant[month]||0):(+user.profile.adiantamento||0);
  return{rows,kmP,valP,exp,km,valorKm,ped,est,total,adiant,dif:r2(total-adiant)};
}

function problemas(user,month){
  const c=calc(user,month);const out=[];
  if(!c.rows.length)out.push({l:'err',m:'Nenhum lançamento neste mês.'});
  c.rows.forEach(e=>{
    const d=fmtBR(e.date);
    if(!(+e.km>0))out.push({l:'err',m:`${d}: falta informar o km.`});
    if(!(e.stops&&e.stops.length))out.push({l:'err',m:`${d}: falta o endereço do atendimento.`});
    if(!String(e.chamado||'').trim())out.push({l:'warn',m:`${d}: falta o número do chamado.`});
    if((+e.pedagio>0||+e.estac>0)&&false)out.push({});
  });
  if(c.rows.length>LIM.kmLinhas)out.push({l:'err',m:`O modelo do Reembolso KM comporta ${LIM.kmLinhas} dias; há ${c.rows.length}.`});
  if(c.exp.TELMEX.length>LIM.solicTelmex)out.push({l:'err',m:`A Solicitação comporta ${LIM.solicTelmex} despesas Telmex; há ${c.exp.TELMEX.length}.`});
  if(c.exp['CFTV BRADESCO'].length>LIM.solicCftv)out.push({l:'err',m:`A Solicitação comporta ${LIM.solicCftv} despesas CFTV; há ${c.exp['CFTV BRADESCO'].length}.`});
  const dias={};c.rows.forEach(e=>dias[e.date]=(dias[e.date]||0)+1);
  Object.entries(dias).forEach(([d,n])=>{if(n>1)out.push({l:'warn',m:`${fmtBR(d)}: ${n} lançamentos no mesmo dia (o modelo traz uma linha por dia).`})});
  const p=user.profile;
  ['nome','matricula','cpf','fornecedor','centro','home'].forEach(k=>{if(!String(p[k]||'').trim())out.push({l:'warn',m:`Perfil: falta ${k}.`})});
  if(c.rows.length&&!out.some(o=>o.l==='err'))out.push({l:'ok',m:`Conferência: ${brl(c.valorKm)} (km) + ${brl(c.ped)} (pedágio) + ${brl(c.est)} (estacionamento) = ${brl(c.total)}.`});
  return out;
}


/* ---------- leitura do texto do chamado (colado pelo técnico) ---------- */
function limpaEnd(e){
  if(!e)return e;
  let x=String(e).replace(/^\s*Endere[çc]o(\s+do\s+atendimento)?\s*:\s*/i,'');
  x=x.replace(/\s*\b(N[ÚU]MERO|N[º°o]|BAIRRO|CIDADE|ESTADO|UF|PA[ÍI]S)\s*:\s*/gi,', ').replace(/\bCEP\s*:?\s*/gi,'');
  const p=x.split(',').map(v=>v.trim()).filter(v=>v&&!/^(brasil|brazil)$/i.test(v));
  return p.join(', ').replace(/\s+/g,' ');
}
function parseChamado(t){
  t=String(t||'').replace(/\r/g,'');
  const g=(re)=>{const m=re.exec(t);return m?m[1].trim():''};
  const r={};
  r.chamado=g(/Id do Chamado\s*:?\s*\n?\s*(\d+-\d+)/i)||g(/N[úu]mero Field:\s*(\S+)/i)||g(/^N[úu]mero:\s*(\S+)/im)||g(/\b(F\d{8,})\b/)||g(/\b(1-\d{6,})\b/);
  r.projeto=/^1-/.test(r.chamado)?'TELMEX':(/^F\d/i.test(r.chamado)?'CFTV BRADESCO':(/telmex/i.test(t)?'TELMEX':(/cftv|bradesco/i.test(t)?'CFTV BRADESCO':'')));
  let end=g(/Endere[çc]o do atendimento:\s*(.+)/i)||g(/^Endere[çc]o\s*\n\s*(.+)$/im)||g(/^Endere[çc]o:\s*(.+)$/im);
  const cep=g(/CEP\/C[óo]digo Postal\s*\n?\s*(\d{5}-?\d{3})/i);
  if(end&&cep&&!/\d{5}-?\d{3}/.test(end))end+=', '+cep.replace(/^(\d{5})-?(\d{3})$/,'$1-$2');
  end=limpaEnd(end);r.end=end;
  let nome=g(/^Nome:\s*(.+)$/im);
  if(!nome&&r.projeto==='TELMEX')nome=g(/Servi[çc]o:\s*(.+)$/im);
  if(nome&&/^(manuten|instala|preventiva|corretiva|vistoria|visita)/i.test(nome))nome='';
  if(!nome&&end){const p=end.split(',').map(x=>x.trim());const uf=/^[A-Za-z]{2}$/.test(p[p.length-1])?1:0;const cid=p[p.length-1-uf]||'';nome=(cid&&p[0]&&cid!==p[0]?cid+' - '+p[0]:p[0]||'')}
  r.nome=nome.replace(/\s+/g,' ').slice(0,60);
  const d=/^Data\s*:?\s*\n?\s*(\d{2})\/(\d{2})\/(\d{2,4})\s*$/im.exec(t);
  if(d)r.date=`${d[3].length===2?'20'+d[3]:d[3]}-${d[2]}-${d[1]}`;
  return r;
}


/* ---------- km automático (OpenStreetMap: Nominatim + OSRM) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let lastGeo=0;
function geoCache(){try{return JSON.parse(localStorage.getItem('geo-cache')||'{}')}catch(e){return{}}}
function geoSave(c){try{localStorage.setItem('geo-cache',JSON.stringify(c))}catch(e){}}
function variantes(addr){
  let n=addr.replace(/\bCEP\s*:?\s*/gi,'').replace(/\bAv\.?(?=\s)/gi,'Avenida').replace(/\bPres\.?(?=\s)/gi,'Presidente').replace(/\bR\.(?=\s|[A-Z])/g,'Rua ').replace(/\bRod\.?(?=\s)/gi,'Rodovia').replace(/\bDr\.?(?=\s)/gi,'Doutor').replace(/\bProf\.?(?=\s)/gi,'Professor').replace(/\bEng\.?(?=\s)/gi,'Engenheiro').replace(/\bCel\.?(?=\s)/gi,'Coronel').replace(/\bGen\.?(?=\s)/gi,'General');
  const cep=(/(\d{5}-?\d{3})/.exec(n)||[])[1]||'';
  n=n.replace(/,?\s*\d{5}-?\d{3}/,'');
  const partes=n.replace(/\s+-\s+/g,', ').split(',').map(x=>x.trim()).filter(Boolean);
  let uf='';if(partes.length&&/^[A-Za-z]{2}$/.test(partes[partes.length-1]))uf=partes.pop();
  const cidade=partes.length>1?partes[partes.length-1]:'';
  const rua=partes[0]||'';const numero=(partes[1]&&/^\d+[A-Za-z]?$/.test(partes[1]))?partes[1]:'';
  const v=[];
  if(rua&&cidade){
    if(numero)v.push([rua,numero,cidade,uf].filter(Boolean).join(', '));
    v.push([rua,cidade,uf].filter(Boolean).join(', '));
  }
  v.unshift(partes.concat(uf?[uf]:[]).join(', '));
  if(cep&&cidade)v.push(cep+', '+cidade);
  v.push(addr);
  return[...new Set(v.filter(Boolean))];
}
async function getJson(url){
  let r;try{r=await fetch(url)}catch(e){throw new Error('Sem acesso ao serviço de mapas ('+new URL(url).hostname+': '+(e&&e.message||e)+'). Abra o arquivo direto no Chrome/Edge (não na prévia do chat); se persistir, a rede ou uma extensão está bloqueando')}
  if(!r.ok)throw new Error('Serviço de mapas respondeu erro '+r.status);
  return r.json();
}
async function geocode(addr){
  const c=geoCache();if(c[addr])return c[addr];
  const vs=variantes(addr);
  for(const q of vs){
    const w=1100-(Date.now()-lastGeo);if(w>0)await sleep(w);lastGeo=Date.now();
    const j=await getJson('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q));
    if(j.length){const p={lat:+j[0].lat,lon:+j[0].lon};c[addr]=p;geoSave(c);return p}
  }
  for(const q of vs.slice(0,2)){
    try{
      const j=await getJson('https://photon.komoot.io/api/?limit=1&lang=default&q='+encodeURIComponent(q+', Brasil'));
      const f=j.features&&j.features[0];
      if(f){const p={lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]};c[addr]=p;geoSave(c);return p}
    }catch(e){}
  }
  throw new Error('Não localizei o endereço "'+addr+'"');
}
async function kmRota(home,stops){
  const seq=[home,...stops,home];const pts=[];
  for(const a of seq)pts.push(await geocode(a));
  const url='https://router.project-osrm.org/route/v1/driving/'+pts.map(p=>p.lon+','+p.lat).join(';')+'?overview=false';
  const r=await fetch(url);if(!r.ok)throw new Error('Serviço de rotas indisponível ('+r.status+')');
  const j=await r.json();if(!j.routes||!j.routes.length)throw new Error('Rota não encontrada');
  const legs=(j.routes[0].legs||[]).map(l=>l.distance/1000);return{total:Math.round(j.routes[0].distance/1000),legs};
}
function linkMaps(home,stops){
  const seq=[home,...stops,home];
  return'https://www.google.com/maps/dir/'+seq.map(encodeURIComponent).join('/');
}


/* ---------- leitura da fatura da tag (PDF) ---------- */
const RE_TAG=/^(\d{2})\/(\d{2})\/(\d{4}) - (\d{2}:\d{2}) (\S+) (Passagem|Estacionamento|Ped[áa]gio) (.*?) - ([\d.]+,\d{2}) ([\d.]+,\d{2})$/;
const parseVal=x=>+String(x).replace(/\./g,'').replace(',','.');
async function lerTag(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await(await pdf.getPage(p)).getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);
    const linhas=[];
    its.forEach(i=>{const l=linhas[linhas.length-1];if(l&&Math.abs(l.y-i.y)<3)l.it.push(i);else linhas.push({y:i.y,it:[i]})});
    linhas.forEach(l=>{
      const t=l.it.sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join(' ').replace(/\s+/g,' ').trim();
      const m=RE_TAG.exec(t);
      if(m)out.push({date:`${m[3]}-${m[2]}-${m[1]}`,hora:m[4],placa:m[5],tipo:/^Estac/.test(m[6])?'estac':'pedagio',desc:m[7].trim(),valor:parseVal(m[8])});
    });
  }
  return out;
}
function tagPorDia(items){
  const d={};
  items.forEach(i=>{const o=d[i.date]=d[i.date]||{date:i.date,ped:0,est:0,np:0,ne:0};if(i.tipo==='estac'){o.est=r2(o.est+i.valor);o.ne++}else{o.ped=r2(o.ped+i.valor);o.np++}});
  return Object.values(d).sort((a,b)=>a.date.localeCompare(b.date));
}


/* ---------- foto do comprovante + leitura do valor (OCR no navegador) ---------- */
let tessP=null,fotosForm=[],pendingFoto=null;
function carregaTess(){
  if(window.Tesseract)return Promise.resolve();
  return tessP||(tessP=new Promise((ok,err)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';sc.onload=ok;sc.onerror=()=>{tessP=null;err(new Error('Não consegui carregar o leitor de imagem (internet ou bloqueio de rede)'))};document.head.appendChild(sc)}));
}
async function ocr(img){await carregaTess();const r=await Tesseract.recognize(img,'por');return r.data.text}
function comprimir(file,max,q){return new Promise((ok,err)=>{const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>err(new Error('Não consegui abrir a imagem'));im.src=url})}
function valoresDe(texto){
  const c=new Map();
  String(texto||'').split('\n').forEach(l=>{
    const chave=/(valor|total|pago|pagar|tarifa|r\$)/i.test(l);const re=/(\d{1,3}(?:\.\d{3})*|\d+)\s*[,.]\s*(\d{2})(?!\d)/g;let m;
    while((m=re.exec(l))){const v=+(m[1].replace(/\./g,'')+'.'+m[2]);if(v>0&&v<1000){const k=v.toFixed(2);const o=c.get(k)||{v,p:0};o.p+=chave?3:1;c.set(k,o)}}
  });
  return[...c.values()].sort((a,b)=>b.p-a.p||a.v-b.v).slice(0,5).map(x=>x.v);
}
async function lerFoto(file){
  const tipo=document.getElementById('fotoTipo').value;
  pendingFoto={tipo,img:null,cands:[],lendo:true};drawFotos();
  try{
    const grande=await comprimir(file,1800,.85);pendingFoto.img=await comprimir(file,900,.55);
    try{pendingFoto.cands=valoresDe(await ocr(grande))}catch(e){pendingFoto.erro=e.message}
    pendingFoto.lendo=false;
  }catch(e){pendingFoto=null;toast(e.message)}
  drawFotos();
}
function drawFotos(){
  const box=document.getElementById('fotoBox');if(!box)return;let h='';
  const p=pendingFoto;
  if(p){
    if(p.lendo)h+='<div class="msg info">Lendo o valor da foto… (na primeira vez pode demorar um pouco)</div>';
    else h+=`<div class="item"><img src="${p.img}" alt="Comprovante" style="max-width:160px;max-height:160px;border-radius:8px;display:block;margin-bottom:8px">
      ${p.erro?`<div class="msg warn">${esc(p.erro)}. Digite o valor.</div>`:(p.cands.length?`<div class="small muted">Valores encontrados. Toque no correto:</div><div class="row" style="margin:6px 0">${p.cands.map(v=>`<button type="button" class="btn sm" data-act="fotoCand" data-v="${v}">${num(v)}</button>`).join('')}</div>`:'<div class="msg warn">Não consegui ler o valor. Digite abaixo.</div>')}
      <div class="row"><input type="number" id="fotoVal" step="0.01" min="0" inputmode="decimal" placeholder="Valor R$" value="${p.cands[0]||''}" style="max-width:150px"><button type="button" class="btn sm primary" data-act="fotoOk">Confirmar e anexar</button><button type="button" class="btn sm" data-act="fotoCancel">Descartar</button></div></div>`;
  }
  fotosForm.forEach((f,i)=>{h+=`<div class="item" style="margin-top:8px"><div class="t"><img src="${FOTOS[f.id]||''}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px"><b>${f.tipo==='estac'?'Estacionamento':'Pedágio'}</b><span>${brl(f.valor)}</span><span class="num"><button type="button" class="btn sm" data-act="fotoRm" data-i="${i}">Remover</button></span></div></div>`});
  box.innerHTML=h;
}

async function genControle(user,month){
  const c=calc(user,month);const p=user.profile;
  const{zip,sheet}=await openTpl('controle');
  const styles=new Styles(await zip.file('xl/styles.xml').async('string'));
  c.rows.forEach((e,i)=>{
    const r=2+i;
    sheet.set('A'+r,p.nome);sheet.set('B'+r,c.adiant);sheet.set('C'+r,c.total);sheet.set('D'+r,c.dif);
    sheet.set('E'+r,serial(e.date),styles.date(sheet.style('E'+r)));sheet.set('F'+r,e.chamado||'');sheet.set('G'+r,e.trajeto);
    sheet.set('H'+r,projLabel(e));sheet.set('I'+r,+e.km||null);
    sheet.set('J'+r,+e.pedagio>0?+e.pedagio:null);sheet.set('K'+r,+e.estac>0?+e.estac:null);
  });
  return saveTpl(zip,sheet,styles);
}
async function genKm(user,month){
  const c=calc(user,month);const p=user.profile;
  const{zip,sheet}=await openTpl('km');
  const styles=new Styles(await zip.file('xl/styles.xml').async('string'));
  sheet.set('G4',p.nome);
  sheet.set('M4',/^[1-9]\d*$/.test(String(p.matricula))?+p.matricula:p.matricula);
  const wrapE=styles.wrap(sheet.style('E15'));
  c.rows.slice(0,LIM.kmLinhas).forEach((e,i)=>{
    const r=15+2*i;
    sheet.set('C'+r,serial(e.date),styles.date(sheet.style('C'+r)));
    sheet.set('E'+r,e.trajeto,wrapE);
    sheet.set('J'+r,motivoKm(e));
    sheet.set('Q'+r,+e.km||null);
    const lines=Math.max(1,Math.ceil(e.trajeto.length/62));
    sheet.height(r,lines>1?Math.round(lines*13.2+6):18);
  });
  return saveTpl(zip,sheet,styles);
}
async function genSolic(user,month){
  const c=calc(user,month);const p=user.profile;
  const{zip,sheet}=await openTpl('solic');
  const styles=new Styles(await zip.file('xl/styles.xml').async('string'));
  const dt=(ref,v)=>sheet.set(ref,v,styles.date(sheet.style(ref)));
  sheet.set('C9',p.nome);sheet.set('K9',/^[1-9]\d*$/.test(String(p.cpf))?+p.cpf:p.cpf);
  sheet.set('N9',/^[1-9]\d*$/.test(String(p.telefone))?+p.telefone:p.telefone);
  sheet.set('Q9',/^[1-9]\d*$/.test(String(p.fornecedor))?+p.fornecedor:p.fornecedor);
  sheet.set('C11',p.area);sheet.set('G11',p.cargo);sheet.set('K11',p.local);sheet.set('M11',p.regional);
  sheet.set('C13',p.empresa);sheet.set('M13',p.centro);sheet.set('Q13',c.adiant);
  sheet.set('C15',p.motivoGasto);
  const fim=serial(ultimoDia(month));
  let r=22;
  for(const pr of['TELMEX','CFTV BRADESCO']){
    if(c.kmP[pr]>0&&r<=24){
      dt('F'+r,fim);
      sheet.set('H'+r,`${c.kmP[pr]} KM ${PROJ[pr].nome} * R$0,99${pr==='TELMEX'?' ':''}`);
      sheet.set('P'+r,c.valP[pr]);r++;
    }
  }
  const sec=(list,start,max,proj)=>{
    list.slice(0,max).forEach((x,i)=>{
      const rr=start+i;
      sheet.set('C'+rr,x.nota||p.placa||'');dt('F'+rr,serial(x.date));
      sheet.set('H'+rr,`DESPESAS ${PROJ[proj].nome} (${x.tipo})`);sheet.set('P'+rr,x.valor);
    });
  };
  sec(c.exp.TELMEX,31,LIM.solicTelmex,'TELMEX');
  sec(c.exp['CFTV BRADESCO'],40,LIM.solicCftv,'CFTV BRADESCO');
  return saveTpl(zip,sheet,styles);
}

function loadScript(src){return new Promise((ok,err)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=()=>err(new Error('Não consegui carregar '+src.split('/').pop()+' (internet ou bloqueio de rede)'));document.head.appendChild(sc)})}
function perfilVazio(a){return{nome:((a&&a.displayName)||'').toUpperCase(),matricula:'',cpf:'',telefone:'',fornecedor:'',area:'',cargo:'',local:'',regional:'',empresa:'',centro:'',adiantamento:0,placa:'',home:'',motivoGasto:'Relatório de despesas referente aos projetos TELMEX e CFTV BRADESCO.'}}
const limpo=o=>JSON.parse(JSON.stringify(o));
const docMes=(u,m)=>({entries:u.entries.filter(e=>e.date.startsWith(m)).sort((a,b)=>a.id-b.id),status:(u.status&&u.status[m])||{s:'Rascunho',motivo:''},adiant:(u.adiant&&u.adiant[m]!==undefined&&u.adiant[m]!==null)?u.adiant[m]:null});
const baseDoc=u=>({email:AUTH.email||'',profile:u.profile,addresses:u.addresses,tag:u.tag||[]});
function setSync(s,m){syncSt={s,m};const el=document.getElementById('sync');if(el)el.textContent=s==='ok'?'Salvo na nuvem':s==='salvando'?'Salvando…':s==='erro'?'Erro ao salvar':''}

async function iniciarNuvem(){
  AUTH={status:'loading'};render();
  try{
    if(!window.firebase)for(const f of['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/10.12.2/firebase-${f}-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);fb.auth=firebase.auth();fb.db=firebase.firestore();
    fb.auth.onAuthStateChanged(onAuth);
  }catch(e){AUTH={status:'erro',msg:e.message};render()}
}
async function onAuth(user){
  if(!user){AUTH={status:'out'};S.users={};S.mine=null;return render()}
  AUTH={status:'loading'};render();
  try{
    const email=(user.email||'').toLowerCase();const ref=fb.db.doc('config/acesso');
    const snap=await ref.get();let cfg=snap.exists?snap.data():null;
    if(!cfg&&email===ADMIN_EMAIL.toLowerCase()){cfg={admins:[email],supervisores:[],emails:[email]};await ref.set(cfg)}
    cfg=cfg||{};const low=a=>(a||[]).map(x=>String(x).trim().toLowerCase());
    const adm=low(cfg.admins).includes(email)||email===ADMIN_EMAIL.toLowerCase();
    const sup=adm||low(cfg.supervisores).includes(email);const tec=low(cfg.emails).includes(email);
    if(!tec&&!sup){AUTH={status:'blocked',email,nome:user.displayName||''};return render()}
    AUTH={status:'ok',user,uid:user.uid,email,nome:user.displayName||'',acesso:{tecnico:tec,supervisor:sup,admin:adm},cfg};
    S.me=user.uid;S.mine=null;
    if(tec)S.mine=await carregarUsuario(user.uid,true,user);
    S.role=tec?'tecnico':(sup?'supervisor':'admin');
    await aplicaPapel();render();
    if(S.mine&&S.mine._novo)agendaNuvem();
  }catch(e){console.error(e);AUTH={status:'erro',msg:e.message};render()}
}
async function carregarUsuario(uid,todos,authUser,mes){
  const ref=fb.db.doc('users/'+uid);const d=await ref.get();const x=d.exists?d.data():null;
  const u={profile:{...perfilVazio(authUser),...((x&&x.profile)||{})},addresses:(x&&x.addresses)||[],tag:(x&&x.tag)||[],entries:[],status:{},adiant:{}};
  if(!x&&authUser)u._novo=true;
  let docs;
  if(todos)docs=(await ref.collection('meses').get()).docs;
  else{const m=await ref.collection('meses').doc(mes).get();docs=m.exists?[m]:[]}
  docs.forEach(m=>{const y=m.data();(y.entries||[]).forEach(e=>u.entries.push(e));u.status[m.id]=y.status||{s:'Rascunho',motivo:''};if(y.adiant!==null&&y.adiant!==undefined)u.adiant[m.id]=y.adiant});
  if(todos&&authUser){
    docs.forEach(m=>{lastW['m:'+uid+m.id]=JSON.stringify(docMes(u,m.id))});
    if(x)lastW['u:'+uid]=JSON.stringify(baseDoc(u));
  }
  return u;
}
async function carregarTodos(){
  const snap=await fb.db.collection('users').get();const users={};
  for(const d of snap.docs)users[d.id]=await carregarUsuario(d.id,false,null,S.month);
  S.sup=users;
}
async function aplicaPapel(){
  if(S.role==='tecnico'){S.users={[S.me]:S.mine};S.userId=S.me}
  else if(S.role==='supervisor'){await carregarTodos();S.users=S.sup;S.userId=Object.keys(S.users)[0]||null}
  else{S.users={};S.userId=null}
  S.view=null;
  if(S.role==='tecnico'&&S.mine&&S.mine._novo)S.view='end';
}
function agendaNuvem(){if(!NUVEM)return;clearTimeout(saveT);setSync('salvando');saveT=setTimeout(nuvemSave,700)}
function temPendencia(){
  const u=S.mine;if(!u)return false;const uid=S.me;
  if(lastW['u:'+uid]!==JSON.stringify(baseDoc(u)))return true;
  const meses=new Set([...u.entries.map(e=>e.date.slice(0,7)),...Object.keys(u.status||{}),...Object.keys(u.adiant||{})]);
  for(const m of meses){const d=docMes(u,m);const vazio=!d.entries.length&&d.status.s==='Rascunho'&&d.adiant===null;if(lastW['m:'+uid+m]!==JSON.stringify(d)&&!(vazio&&lastW['m:'+uid+m]===undefined))return true}
  return false;
}
async function nuvemSave(){
  const u=S.mine;if(!u||!AUTH.acesso||!AUTH.acesso.tecnico)return;
  try{
    const uid=S.me;const ts=firebase.firestore.FieldValue.serverTimestamp();
    const base=baseDoc(u);const jb=JSON.stringify(base);
    if(lastW['u:'+uid]!==jb){await fb.db.doc('users/'+uid).set({...limpo(base),atualizado:ts},{merge:true});lastW['u:'+uid]=jb}
    const meses=new Set([...u.entries.map(e=>e.date.slice(0,7)),...Object.keys(u.status||{}),...Object.keys(u.adiant||{})]);
    for(const m of meses){
      const d=docMes(u,m);const j=JSON.stringify(d);const k='m:'+uid+m;
      if(lastW[k]===j)continue;
      if(!d.entries.length&&d.status.s==='Rascunho'&&d.adiant===null&&lastW[k]===undefined)continue;
      await fb.db.doc(`users/${uid}/meses/${m}`).set({...limpo(d),atualizado:ts});lastW[k]=j;
    }
    setSync('ok');
  }catch(e){console.error(e);setSync('erro',e.message);toast('Não consegui salvar na nuvem: '+e.message)}
}
async function persistStatus(uid){
  if(!NUVEM)return;
  try{const st=stat(S.users[uid],S.month);await fb.db.doc(`users/${uid}/meses/${S.month}`).update({status:limpo(st)});setSync('ok')}
  catch(e){console.error(e);toast('Não foi possível gravar o status: '+e.message)}

}

function download(name,data,type){
  const b=new Blob([data],{type:type||'application/octet-stream'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const XL='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
let ajusteId=null;
function linhasParadas(f){return[...f.querySelectorAll('.stops .s')].filter(r=>r.querySelector('select').value)}
function projDaLinha(f,r){return r.dataset.proj||f.elements.projeto.value}
function atualizaSplit(f){
  const ps=[...new Set(linhasParadas(f).map(r=>projDaLinha(f,r)))];
  const box=document.getElementById('splitBox');if(box)box.style.display=ps.length>1?'':'none';
  return ps.length>1;
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act;const u=U();
  if(a==='login'){try{await fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(err){toast('Login cancelado ou bloqueado: '+(err.message||err))}return}
  if(a==='logout'){clearTimeout(saveT);try{await nuvemSave();await fb.auth.signOut()}catch(e){}AUTH={status:'out'};S.users={};S.mine=null;render();return}
  if(a==='recarrega'){location.reload();return}
  if(a==='view'){S.view=b.dataset.v;editId=null}
  else if(a==='ptab'){prevTab=b.dataset.t}
  else if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark'}
  else if(a==='addstop'){const f=b.closest('form');const s=f.querySelector('.stops .s').cloneNode(true);s.querySelector('select').value='';s.dataset.ch='';s.dataset.proj='';b.before(s);return}
  else if(a==='rmstop'){const f=b.closest('form');const all=f.querySelectorAll('.stops .s');if(all.length>1){b.closest('.s').remove();atualizaSplit(f)}return}
  else if(a==='edit'){editId=+b.dataset.id;const ed=u.entries.find(x=>x.id===editId);if(ed&&ed.fotos)await Promise.all(ed.fotos.map(f=>fotoGet(f.id)));window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='cancel'){editId=null}
  else if(a==='del'){if(!confirm('Excluir este lançamento?'))return;u.entries=u.entries.filter(x=>x.id!==+b.dataset.id)}
  else if(a==='rmend'){u.addresses=u.addresses.filter(x=>x.id!==+b.dataset.id)}
  else if(a==='enviar'){stat(u,S.month).s='Enviado';stat(u,S.month).motivo='';toast('Enviado para aprovação')}
  else if(a==='recolher'){stat(u,S.month).s='Rascunho';toast('Envio recolhido')}
  else if(a==='abrir'){S.userId=b.dataset.id;S.view='mes'}
  else if(a==='aprovar'){stat(S.users[b.dataset.id],S.month).s='Aprovado';await persistStatus(b.dataset.id);toast('Aprovado')}
  else if(a==='pagar'){stat(S.users[b.dataset.id],S.month).s='Pago';await persistStatus(b.dataset.id);toast('Marcado como pago')}
  else if(a==='ajuste'){ajusteId=b.dataset.id;document.getElementById('dlg').showModal();return}
  else if(a==='gen'){
    try{
      const nm=nomeArquivos(u,S.month);const k=b.dataset.k;
      if(k==='zip'){
        const r=await gerarTodas(u,S.month);const z=new JSZip();
        z.file(nm.controle,r.controle);z.file(nm.km,r.km);z.file(nm.solic,r.solic);
        download(`Reembolso ${u.profile.nome} ${S.month}.zip`,await z.generateAsync({type:'uint8array'}),'application/zip');
      }else{
        const fn={controle:genControle,km:genKm,solic:genSolic}[k];
        download(nm[k],await fn(u,S.month),XL);
      }
      toast('Planilha gerada');
    }catch(e){console.error(e);toast('Erro ao gerar: '+e.message)}
    return;
  }
  else if(a==='juntar'){
    const d=b.dataset.d;const lst=u.entries.filter(x=>x.date===d).sort((x,y)=>x.id-y.id);
    if(lst.length<2||!confirm('Juntar os '+lst.length+' lançamentos de '+fmtBR(d)+' em um só? O km será recalculado.'))return;
    const stops=[],metas=[];
    lst.forEach(x=>(x.stops||[]).forEach((st,i)=>{const m=x.metas&&x.metas[i];stops.push(st);const ch=m?m.ch:(i===0?(x.chamado||''):'');metas.push({ch,proj:/^1-/.test(ch)?'TELMEX':/^F\d/i.test(ch)?'CFTV BRADESCO':(m?m.proj:x.projeto)})}));
    const st2=[],me2=[];
    stops.forEach((st,i)=>{if(st2.length&&st2[st2.length-1]===st){const l=me2[me2.length-1];l.ch=[l.ch,metas[i].ch].filter(Boolean).join(' / ')}else{st2.push(st);me2.push({...metas[i]})}});
    const ps=[...new Set(me2.map(m=>m.proj))];
    const nova={id:newId(),date:d,projeto:me2[0]?me2[0].proj:lst[0].projeto,chamado:[...new Set(lst.flatMap(x=>String(x.chamado||'').split(' / ').filter(Boolean)))].join(' / '),
      stops:st2,metas:me2,km:0,pedagio:r2(lst.reduce((t,x)=>t+(+x.pedagio||0),0)),estac:r2(lst.reduce((t,x)=>t+(+x.estac||0),0)),
      split:ps.length>1?{'CFTV BRADESCO':0,'TELMEX':0}:null};
    u.entries=u.entries.filter(x=>x.date!==d);u.entries.push(nova);editId=nova.id;save();render();
    window.scrollTo({top:0});setTimeout(()=>{const bt=document.querySelector('[data-act=calckm]');if(bt)bt.click()},80);return;
  }
  else if(a==='calckm'||a==='maps'){
    const f=b.closest('form');const stops=[...f.querySelectorAll('select[name=stop]')].map(x=>x.value).filter(Boolean);const msg=document.getElementById('kmMsg');
    if(!stops.length){msg.textContent='Escolha ao menos um endereço.';return}
    if(a==='maps'){window.open(linkMaps(u.profile.home,stops),'_blank','noopener');return}
    b.disabled=true;msg.textContent='Calculando… (pode levar alguns segundos)';
    try{const R=await kmRota(u.profile.home,stops);let km=R.total;f.elements.km.value=km;
      const linhas=linhasParadas(f);const projs=linhas.map(r=>projDaLinha(f,r));let rep='';
      if(new Set(projs).size>1&&R.legs.length===projs.length+1){
        let c=0;R.legs.forEach((d,i)=>{if((i<projs.length?projs[i]:projs[projs.length-1])==='CFTV BRADESCO')c+=d});
        const kc=Math.round(c),kt=km-kc;f.elements.kmCFTV.value=kc;f.elements.kmTELMEX.value=kt;atualizaSplit(f);
        rep=` Repartição: CFTV ${kc} km · TELMEX ${kt} km (cada trecho vai para o projeto do destino; o retorno vai para o projeto da última parada).`;
      }
      const nomes=['Residência',...stops.map((x,i)=>'Parada '+(i+1)),'Residência'];
      const det=R.legs.map((d,i)=>`${nomes[i]} → ${nomes[i+1]}: ${d.toFixed(1).replace('.',',')} km`).join(' · ');
      msg.textContent=`Total ida e volta: ${km} km (OpenStreetMap). ${det}. Confira no Google Maps se necessário.${rep}`}
    catch(err){msg.textContent=err.message+' — digite o km manualmente.'}
    b.disabled=false;return;
  }
  else if(a==='parse'){
    const r=parseChamado(document.getElementById('cola').value);const f=b.closest('form');const msg=document.getElementById('parseMsg');
    if(!r.chamado&&!r.end&&!r.projeto){msg.textContent='Não encontrei dados do chamado nesse texto.';return}
    const jaTem=f.elements.chamado.value.trim();
    if(r.chamado){const lista=jaTem?jaTem.split(' / '):[];if(!lista.includes(r.chamado))lista.push(r.chamado);f.elements.chamado.value=lista.join(' / ')}
    if(r.projeto&&!jaTem)f.elements.projeto.value=r.projeto;
    if(r.date&&!jaTem)f.elements.date.value=r.date;
    let aviso='';
    if(r.date&&jaTem&&r.date!==f.elements.date.value)aviso=' Atenção: a data deste chamado ('+fmtBR(r.date)+') é diferente da data do lançamento.';
    if(r.end){
      const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');
      let ad=u.addresses.find(x=>norm(x.end)===norm(r.end));
      if(!ad){ad={id:newId(),nome:r.nome||'Local do chamado',end:r.end};u.addresses.push(ad);save()}
      const addOpt=sel=>{if(![...sel.options].some(o=>o.value===ad.end)){const o=document.createElement('option');o.value=ad.end;o.textContent=ad.nome+' — '+ad.end;sel.appendChild(o)}};
      f.querySelectorAll('select[name=stop]').forEach(addOpt);
      const sels=[...f.querySelectorAll('select[name=stop]')];
      const vazio=sels.find(x=>!x.value);let row;
      if(vazio){vazio.value=ad.end;row=vazio.closest('.s')}
      else if(sels[sels.length-1].value!==ad.end){
        const nova=sels[0].closest('.s').cloneNode(true);const ns=nova.querySelector('select');ns.value=ad.end;nova.dataset.ch='';nova.dataset.proj='';
        f.querySelector('[data-act=addstop]').before(nova);row=nova;
      }else row=sels[sels.length-1].closest('.s');
      row.dataset.proj=r.projeto||f.elements.projeto.value;
      if(r.chamado)row.dataset.ch=(row.dataset.ch&&!row.dataset.ch.includes(r.chamado))?row.dataset.ch+' / '+r.chamado:(row.dataset.ch||r.chamado);
    }
    const n=f.querySelectorAll('select[name=stop]').length;const multi=atualizaSplit(f);
    msg.textContent='Preenchido: '+[r.chamado,r.projeto,r.end].filter(Boolean).join(' · ')+'.'+(n>1?` O dia tem ${n} paradas (casa → ... → casa).`:'')+(multi?' Dia com projetos diferentes: o km será repartido entre eles.':'')+' Cole outro chamado do mesmo dia para somar a parada, ou calcule o km.'+aviso;
    document.getElementById('cola').value='';
    return;
  }
  else if(a==='foto'){document.getElementById('fotoIn').click();return}
  else if(a==='fotoCand'){document.getElementById('fotoVal').value=b.dataset.v;return}
  else if(a==='fotoCancel'){pendingFoto=null;drawFotos();return}
  else if(a==='fotoOk'){
    const f=document.querySelector('form[data-form=entry]');const v=r2(+document.getElementById('fotoVal').value||0);
    const fid='f'+newId().toString(36);
    try{await fotoPut(fid,pendingFoto.img)}catch(err){toast('Não foi possível salvar a foto: '+err.message);return}
    fotosForm.push({id:fid,tipo:pendingFoto.tipo,valor:v});
    if(v>0){const campo=f.elements[pendingFoto.tipo==='estac'?'estac':'pedagio'];campo.value=r2((+campo.value||0)+v)}
    pendingFoto=null;drawFotos();toast('Comprovante anexado');return}
  else if(a==='fotoRm'){
    const f=document.querySelector('form[data-form=entry]');const it=fotosForm.splice(+b.dataset.i,1)[0];
    if(it&&it.valor>0){const campo=f.elements[it.tipo==='estac'?'estac':'pedagio'];campo.value=Math.max(0,r2((+campo.value||0)-it.valor))||''}
    drawFotos();return}
  else if(a==='lertag'){
    const msg=document.getElementById('tagMsg');msg.textContent='Lendo…';
    try{
      let todos=[];
      for(const f of comprovFiles.filter(f=>f.type==='application/pdf'))todos=todos.concat(await lerTag(f));
      const seen=new Set();todos=todos.filter(i=>{const k=[i.date,i.hora,i.placa,i.tipo,i.valor,i.desc].join('|');if(seen.has(k))return false;seen.add(k);return true});
      U().tag=todos;save();render();
      document.getElementById('tagMsg').textContent=todos.length?`${todos.length} lançamento(s) lido(s). Confira com a fatura antes de aplicar.`:'Não encontrei passagens nesses PDFs. Eles são o "Histórico de lançamentos" da tag?';
    }catch(err){console.error(err);msg.textContent='Erro ao ler o PDF: '+err.message}
    return;
  }
  else if(a==='limpartag'){u.tag=[]}
  else if(a==='aplicartag'){
    let n=0;
    tagPorDia(u.tag||[]).forEach(d=>{
      const e=u.entries.filter(x=>x.date===d.date).sort((x,y)=>x.id-y.id)[0];
      if(!e)return;
      if(d.np)e.pedagio=d.ped;
      if(d.ne)e.estac=d.est;
      n++;
    });
    toast(n?`Pedágio e estacionamento aplicados em ${n} dia(s)`:'Nenhum dia da fatura tem lançamento')
  }
  else if(a==='pick'){document.getElementById('fileIn').click();return}
  else if(a==='rmfile'){comprovFiles.splice(+b.dataset.i,1)}
  else if(a==='merge'){
    try{
      const{PDFDocument}=PDFLib;const out=await PDFDocument.create();
      const font=await out.embedFont(PDFLib.StandardFonts.Helvetica);
      for(const e of u.entries.filter(x=>x.date.startsWith(S.month)).sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id))for(const f of(e.fotos||[])){
        const dataUrl=await fotoGet(f.id);if(!dataUrl)continue;
        const bytes=Uint8Array.from(atob(dataUrl.split(',')[1]),ch=>ch.charCodeAt(0));const img=await out.embedJpg(bytes);
        const W=595.28,H=841.89,m=36;const sc=Math.min((W-2*m)/img.width,(H-2*m-30)/img.height,1);const pg=out.addPage([W,H]);
        pg.drawText(`${fmtBR(e.date)} - ${f.tipo==='estac'?'Estacionamento':'Pedagio'}${f.valor?' - R$ '+num(f.valor):''}`,{x:m,y:H-m,size:12,font});
        pg.drawImage(img,{x:m,y:H-m-20-img.height*sc,width:img.width*sc,height:img.height*sc});
      }
      for(const f of comprovFiles){
        const buf=await f.arrayBuffer();
        if(f.type==='application/pdf'){
          const d=await PDFDocument.load(buf,{ignoreEncryption:true});
          const pgs=await out.copyPages(d,d.getPageIndices());pgs.forEach(p=>out.addPage(p));
        }else{
          const img=f.type==='image/png'?await out.embedPng(buf):await out.embedJpg(buf);
          const W=595.28,H=841.89,m=28;const sc=Math.min((W-2*m)/img.width,(H-2*m)/img.height,1);
          const pg=out.addPage([W,H]);const w=img.width*sc,h=img.height*sc;
          pg.drawImage(img,{x:(W-w)/2,y:H-m-h,width:w,height:h});
        }
      }
      download(nomeArquivos(u,S.month).comprov,await out.save(),'application/pdf');toast('PDF gerado');
    }catch(e){console.error(e);toast('Erro ao juntar: '+e.message)}
    return;
  }
  save();render();
});

document.addEventListener('input',ev=>{
  const t=ev.target;if(t.name==='kmCFTV'||t.name==='kmTELMEX'){const f=t.form;f.elements.km.value=(+f.elements.kmCFTV.value||0)+(+f.elements.kmTELMEX.value||0)}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='fotoIn'){const fl=t.files[0];t.value='';if(fl)lerFoto(fl);return}
  if(t.id==='fileIn'){comprovFiles.push(...t.files);save();render();return}
  if(t.name==='adiantMes'){const u=U();u.adiant=u.adiant||{};const v=String(t.value).trim();
    if(v==='')delete u.adiant[S.month];else u.adiant[S.month]=Math.max(0,+v.replace(/\./g,'').replace(',','.')||0);
    save();render();return}
  if(t.name==='projeto'&&t.form){atualizaSplit(t.form);return}
  if(t.name==='chamado'&&t.form){
    const l=t.value.split(/\s*[\/,;]\s*/).filter(Boolean);
    if(l.length&&l.every(x=>/^1-/.test(x)))t.form.elements.projeto.value='TELMEX';
    else if(l.length&&l.every(x=>/^F\d/i.test(x)))t.form.elements.projeto.value='CFTV BRADESCO';
    atualizaSplit(t.form);return}
  const a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='role'){S.role=t.value;if(NUVEM){try{await aplicaPapel()}catch(err){toast(err.message)}}else{S.view=null;if(S.role==='tecnico')S.userId='u1'}}
  else if(a==='user'){S.userId=t.value}
  else if(a==='mm'||a==='yy'){
    let[y,m]=S.month.split('-');
    if(a==='mm')m=String(t.value).padStart(2,'0');else y=t.value;
    S.month=`${y}-${m}`;editId=null;
    if(NUVEM&&S.role==='supervisor'){try{await carregarTodos();S.users=S.sup;if(!S.users[S.userId])S.userId=Object.keys(S.users)[0]||null}catch(err){toast(err.message)}}
  }
  save();render();
});

document.addEventListener('submit',async ev=>{
  const f=ev.target;const kind=f.dataset.form;if(!kind)return;
  const u=U();const fd=new FormData(f);
  if(kind==='entry'){
    ev.preventDefault();
    const stops=fd.getAll('stop').filter(Boolean);
    if(!stops.length){toast('Escolha ao menos um endereço');return}
    const obj={notaPed:String(fd.get('notaPed')||'').trim(),notaEst:String(fd.get('notaEst')||'').trim(),date:fd.get('date'),projeto:fd.get('projeto'),chamado:String(fd.get('chamado')||'').trim(),stops,
      km:+fd.get('km')||0,pedagio:+fd.get('pedagio')||0,estac:+fd.get('estac')||0};
    if(pendingFoto){toast('Confirme ou descarte a foto do comprovante');return}
    obj.fotos=fotosForm.slice();
    const linhas=linhasParadas(f);
    obj.metas=linhas.map(r=>({ch:r.dataset.ch||'',proj:projDaLinha(f,r)}));
    const ps=[...new Set(obj.metas.map(m=>m.proj))];
    if(ps.length>1){
      obj.split={'CFTV BRADESCO':+fd.get('kmCFTV')||0,'TELMEX':+fd.get('kmTELMEX')||0};
      obj.km=obj.split['CFTV BRADESCO']+obj.split['TELMEX'];
      if(!(obj.km>0)){toast('Informe o km de cada projeto');return}
    }else obj.split=null;
    if(editId){const e=u.entries.find(x=>x.id===editId);Object.assign(e,obj);editId=null}
    else{obj.id=newId();u.entries.push(obj)}
    if(!obj.date.startsWith(S.month))S.month=obj.date.slice(0,7);
    toast('Lançamento salvo');
  }else if(kind==='home'){ev.preventDefault();u.profile.home=String(fd.get('home')).trim();toast('Residência salva')}
  else if(kind==='end'){ev.preventDefault();u.addresses.push({id:newId(),nome:String(fd.get('nome')).trim(),end:String(fd.get('end')).trim()});toast('Local adicionado')}
  else if(kind==='acessos'){
    ev.preventDefault();
    const lista=n=>[...new Set(String(fd.get(n)||'').split(/[\n,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];
    const cfg={emails:lista('emails'),supervisores:lista('supervisores'),admins:lista('admins')};
    if(!cfg.admins.includes(AUTH.email))cfg.admins.push(AUTH.email);
    try{await fb.db.doc('config/acesso').set(cfg);AUTH.cfg=cfg;toast('Acessos salvos')}catch(err){toast('Não foi possível salvar: '+err.message)}
    render();return;
  }
  else if(kind==='perfil'){ev.preventDefault();delete u._novo;for(const[k,v]of fd.entries())u.profile[k]=k==='adiantamento'?(+String(v).replace(',','.')||0):String(v).trim();toast('Dados salvos')}
  else if(kind==='ajuste'){
    const sub=ev.submitter&&ev.submitter.value;
    if(sub==='ok'&&ajusteId){const st=stat(S.users[ajusteId],S.month);st.s='Ajuste';st.motivo=String(fd.get('motivo')).trim();persistStatus(ajusteId);toast('Ajuste solicitado')}
  }
  save();render();
});

load();render();if(NUVEM)iniciarNuvem();
window.__app={valoresDe,lerTag,tagPorDia,variantes,kmRota,parseChamado,calc,problemas,genControle,genKm,genSolic,gerarTodas,trajeto,get S(){return S},set S(v){S=v}};
</script>
</body>
